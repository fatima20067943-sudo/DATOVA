<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DATOVA — Discover What Data Hides.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23E7DFF7'/%3E%3Ccircle cx='50' cy='50' r='26' fill='none' stroke='%239B87F5' stroke-width='7'/%3E%3Cpath transform='translate(50 50) scale(1.3) translate(-12 -12)' d='M12 0C13 7 17 11 24 12C17 13 13 17 12 24C11 17 7 13 0 12C7 11 11 7 12 0Z' fill='%237C5CFF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#F6F3EE;
  --lavender:#C9C5D9;
  --white:#FFFFFF;
  --lilac:#CBC6EA;
  --blue:#BFC4DA;
  --gray:#777B91;
  --ink:#272A43;
  --body:#5A5D78;
  --purple:#6E6AA8;
  --purple-2:#A8A4D4;
  --glass:rgba(255,255,255,.58);
  --glass-line:rgba(255,255,255,.85);
  --shadow:0 18px 50px -20px rgba(39,42,67,.25);
  --radius:22px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;
  font-family:Inter,Cairo,system-ui,sans-serif;
  color:var(--body);background:var(--ivory);
  line-height:1.65;overflow-x:hidden;
}
:lang(ar) body,body:lang(ar){font-family:Cairo,Inter,system-ui,sans-serif}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--purple);outline-offset:3px;border-radius:8px}

/* ---------- background ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:
    radial-gradient(60% 50% at 12% 8%,rgba(217,203,187,0.45),transparent 45%),
    radial-gradient(50% 45% at 92% 18%,rgba(237,227,213,0.8),transparent 45%),
    radial-gradient(55% 50% at 80% 95%,rgba(217,203,187,0.35),transparent 45%),
    
    var(--ivory);}
.bubble{position:absolute;border-radius:50%;
  background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.95),rgba(201,184,255,.28) 42%,rgba(167,227,255,.22) 72%,rgba(247,200,216,.12));
  border:1px solid rgba(255,255,255,.7);
  box-shadow:inset -10px -14px 30px rgba(167,139,250,.18),0 20px 50px -25px rgba(124,92,255,.4);
  backdrop-filter:blur(3px)}
.b1{width:190px;height:190px;top:-50px;inset-inline-end:-40px}
.b2{width:120px;height:120px;bottom:12%;inset-inline-start:-30px}
.b3{width:70px;height:70px;top:46%;inset-inline-end:6%}
.spark{position:absolute;width:22px;height:22px;fill:#B3AEE3;opacity:.85}
.s1{top:120px;inset-inline-start:9%}
.s2{top:38%;inset-inline-end:14%;width:14px;height:14px}
.s3{bottom:16%;inset-inline-end:30%;width:18px;height:18px}

/* ---------- layout ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:18px 20px 60px}
.glass{background:var(--glass);border:1px solid var(--glass-line);border-radius:var(--radius);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow)}

header.top{display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;border-radius:999px;margin-bottom:56px}
.wordmark{direction:ltr;unicode-bidi:isolate;display:inline-flex;align-items:center;
  font-family:Montserrat,sans-serif;font-weight:300;letter-spacing:.09em;
  background:linear-gradient(100deg,#272A43 0%,#272A43 60%,#4A4D78 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.wordmark.sm{font-size:24px}
.wordmark.lg{font-size:54px}
.logo-o{width:1.45em;height:1.45em;margin:0 .02em;flex:none;overflow:visible}
.lang{border:1px solid var(--glass-line);background:rgba(255,255,255,.7);color:var(--ink);
  padding:7px 16px;border-radius:999px;font-weight:600;font-size:14px}
.lang:hover{background:#fff}

/* ---------- hero ---------- */
.hero{max-width:720px;margin:0 auto 34px;text-align:center}
.hero h1{margin:0 0 14px;font-family:Montserrat,Cairo,sans-serif;font-weight:500;
  font-size:clamp(30px,6vw,52px);line-height:1.2;color:var(--ink);letter-spacing:.01em}
.hero h1 em{font-style:normal;white-space:nowrap;background:linear-gradient(100deg,#272A43,#6E6AA8 55%,#A8A4D4);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0 auto;max-width:560px;font-size:17px}

/* ---------- upload ---------- */
.upload{max-width:640px;margin:0 auto;padding:22px}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
  padding:38px 20px;border-radius:18px;border:1.5px dashed var(--lilac);
  background:linear-gradient(160deg,rgba(255,255,255,.5),rgba(233,230,244,.55));
  transition:background .2s,border-color .2s}
.drop.over{border-color:var(--purple);background:rgba(203,198,234,.4)}
.drop svg{width:54px;height:54px;margin-bottom:6px}
.drop strong{color:var(--ink);font-size:18px}
.drop small{color:var(--gray);font-size:14px}
.btn{border:0;border-radius:999px;padding:12px 28px;font-weight:600;font-size:16px;color:#fff;
  background:linear-gradient(120deg,#272A43,#3F4370);box-shadow:0 10px 24px -10px rgba(39,42,67,.55);
  transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 14px 28px -10px rgba(124,92,255,.8)}
.btn.ghost{color:var(--purple);background:rgba(255,255,255,.75);box-shadow:none;border:1px solid var(--lilac)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

.chosen{display:none;align-items:center;gap:12px;margin-top:16px;padding:12px 16px;border-radius:16px;
  background:rgba(255,255,255,.75);border:1px solid var(--glass-line)}
.chosen.show{display:flex}
.chosen .name{flex:1;min-width:0;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:start}
.chosen .size{color:var(--gray);font-size:14px;direction:ltr}
.actions{display:none;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.actions.show{display:flex}

.error{display:none;margin-top:16px;padding:14px 16px;border-radius:16px;
  background:rgba(247,200,216,.55);border:1px solid rgba(233,147,184,.6);color:#7A2148;font-weight:500}
.error.show{display:block}

/* ---------- loading ---------- */
.loading{display:none;max-width:460px;margin:20px auto 0;padding:36px 28px;text-align:center}
.loading .logo-o{width:96px;height:96px;margin:0 auto 18px;display:block}
.orbit-g{transform-box:view-box;transform-origin:50% 50%;animation:orbit 5s linear infinite}
.pulse{transform-box:view-box;transform-origin:50% 50%;animation:pulse 2.4s ease-in-out infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.25)}}
.steps{list-style:none;margin:0;padding:0;text-align:start;display:grid;gap:10px}
.steps li{display:flex;align-items:center;gap:12px;color:var(--gray);transition:color .3s}
.steps li::before{content:"";flex:none;width:12px;height:12px;border-radius:50%;
  border:2px solid var(--lilac);background:transparent;transition:all .3s}
.steps li.active{color:var(--ink);font-weight:600}
.steps li.active::before{background:var(--purple);border-color:var(--purple);box-shadow:0 0 0 5px rgba(110,106,168,.2)}
.steps li.done{color:var(--body)}
.steps li.done::before{background:var(--blue);border-color:var(--blue)}

/* ---------- results ---------- */
.results{display:none}
.res-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.res-btns{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;
  background:rgba(255,255,255,.75);border:1px solid var(--glass-line);color:var(--ink);font-weight:600}
.chip small{color:var(--gray);font-weight:500}
.summary{padding:24px 26px;margin-bottom:18px}
.summary h2,.card h3{margin:0 0 8px;color:var(--ink);font-family:Montserrat,Cairo,sans-serif;font-weight:600}
.summary h2{font-size:20px}
.summary p{margin:0;font-size:17px;color:var(--ink)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.stat{padding:16px 18px;border-radius:18px;background:rgba(255,255,255,.7);border:1px solid var(--glass-line)}
.stat small{display:block;color:var(--gray);font-size:13px}
.stat b{display:block;color:var(--ink);font-family:Montserrat,sans-serif;font-weight:500;font-size:26px;line-height:1.3}
.stat span{font-size:13px;color:var(--gray)}
.notes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.note{padding:5px 12px;border-radius:999px;font-size:13px;background:rgba(231,223,247,.8);color:var(--ink)}
.note.warn{background:rgba(247,200,216,.7)}

.sec-title{margin:30px 0 14px;color:var(--ink);font-family:Montserrat,Cairo,sans-serif;font-weight:600;font-size:20px}
.charts{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.card{padding:22px}
.charts .card:last-child:nth-child(odd){grid-column:1/-1}
.card h3{font-size:17px;margin-bottom:16px}

.hbar{display:grid;grid-template-columns:minmax(70px,30%) 1fr 84px;align-items:center;gap:10px;margin:9px 0;font-size:14px}
.hb-label{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-track{height:12px;border-radius:99px;background:rgba(201,184,255,.22);overflow:hidden}
.hb-track i{display:block;height:100%;border-radius:99px;width:0;
  background:linear-gradient(90deg,var(--lilac),var(--purple-2));transition:width .9s cubic-bezier(.2,.7,.2,1)}
.hb-track i.neg{background:linear-gradient(90deg,var(--pink),#E993B8)}
.hb-val{color:var(--body);font-weight:600;font-variant-numeric:tabular-nums;direction:ltr;text-align:start}

.vbars{direction:ltr;display:flex;align-items:stretch;gap:4px;height:240px}
.vb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.vb-plot{flex:1;width:100%;display:flex;align-items:flex-end}
.vb-plot i{display:block;width:100%;height:0;min-height:2px;border-radius:8px 8px 3px 3px;
  background:linear-gradient(180deg,var(--purple-2),var(--lilac));transition:height .9s cubic-bezier(.2,.7,.2,1)}
.vb span{margin-top:6px;font-size:11px;color:var(--gray);white-space:nowrap;height:16px}

.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center}
.donut-wrap svg{width:190px;height:190px;flex:none;transform:none}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px;flex:1;min-width:150px}
.legend li{display:flex;align-items:center;gap:10px}
.legend i{width:12px;height:12px;border-radius:50%;flex:none}
.legend .l{flex:1;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .p{color:var(--gray);font-weight:600;direction:ltr}

.two{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.list li{display:flex;gap:12px;align-items:flex-start;color:var(--ink)}
.list svg{width:20px;height:20px;flex:none;margin-top:4px}
.again{text-align:center;margin-top:34px}

footer{margin-top:64px;text-align:center;color:var(--gray);font-size:14px}
footer .wordmark{margin-bottom:8px}
footer p{margin:2px 0}

/* ---------- الفلتر ---------- */
/* ---------- لوحة المعلومات المخصصة ---------- */
.chead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ctools{display:flex;gap:2px;flex:none}
.dbar{display:grid;gap:12px;margin:0 0 16px}
.dbtns,.dask{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dask .finp{flex:1;min-width:200px}
.dform{padding:16px 18px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:12px}
.dgrid .flab{flex-direction:column;align-items:stretch;gap:4px}
.okmsg{display:none;padding:12px 16px;border-radius:16px;background:rgba(231,223,247,.7);border:1px solid var(--glass-line);color:var(--ink)}
.okmsg.show{display:block}
.lhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.lhead h3{margin:0}
.btn.sm{padding:7px 16px;font-size:14px}
.list .fx{margin-inline-start:auto}
.plist{display:grid;gap:12px}
.prob{padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.7);border:1px solid var(--glass-line)}
.prob p{margin:6px 0 0;color:var(--ink)}
.prob .pfix{color:var(--body)}
.ptop{display:flex;align-items:center;gap:10px}
.ptop b{flex:1;color:var(--ink)}
.sev{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;flex:none}
.sev.high{background:rgba(247,200,216,.85);color:#7A2148}
.sev.medium{background:rgba(255,226,170,.8);color:#7A4B00}
.sev.low{background:rgba(231,223,247,.95);color:var(--ink)}
.fpanel{padding:18px 22px;margin:0 0 18px}
.fhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fhead h3{margin:0;font-size:18px;color:var(--ink);font-family:Montserrat,Cairo,sans-serif;font-weight:600}
.fbody{display:none;flex-direction:column;gap:16px;margin-top:16px}
.fbody.open{display:flex}
.frows{display:grid;gap:10px}
.frow{display:grid;grid-template-columns:minmax(120px,1fr) minmax(110px,.7fr) 2fr auto;gap:10px;align-items:start;
  padding:12px;border-radius:16px;background:rgba(255,255,255,.7);border:1px solid var(--glass-line)}
.fsel,.finp{width:100%;padding:9px 12px;border-radius:12px;border:1px solid var(--lilac);background:#fff;color:var(--ink);font:inherit;font-size:15px}
.fop{padding:9px 4px;color:var(--gray);font-size:15px}
.fval{display:grid;gap:8px;min-width:0}
.fvals{max-height:140px;overflow:auto;display:grid;gap:4px;padding:6px 4px}
.fvals label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)}
.flab{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--gray)}
.flab .finp{flex:1}
.fx{border:0;background:transparent;color:var(--gray);font-size:24px;line-height:1;padding:4px 8px}
.fx:hover{color:var(--ink)}
.fgroup h4{margin:0 0 8px;font-size:15px;color:var(--ink)}
.fgran,.fchips{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--lilac);background:rgba(255,255,255,.75);color:var(--ink);padding:6px 14px;border-radius:999px;font-size:14px}
.pill.on{background:var(--purple);border-color:var(--purple);color:#fff}
.fchips label{display:inline-flex;gap:6px;align-items:center;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.75);
  border:1px solid var(--glass-line);font-size:14px;color:var(--ink)}
.factions{display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:820px){.frow{grid-template-columns:1fr}}
@media (max-width:820px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .charts,.two{grid-template-columns:1fr}
  .wordmark.lg{font-size:40px}
  header.top{margin-bottom:36px}
}
@media (prefers-reduced-motion:reduce){
  .orbit-g,.pulse{animation:none}
  .hb-track i,.vb-plot i{transition:none}
}
.bubble,
.b1,
.b2,
.b3{
  display: none !important;
}
</style>
</head>
<body>

<!-- gradient + star symbol shared by the whole page -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gO" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E7CF0"/><stop offset=".55" stop-color="#C9B8FF"/><stop offset="1" stop-color="#F3A9C9"/>
    </linearGradient>
    <symbol id="star" viewBox="0 0 24 24"><path d="M12 0C13 7 17 11 24 12C17 13 13 17 12 24C11 17 7 13 0 12C7 11 11 7 12 0Z"/></symbol>
  </defs>
</svg>

<div class="bg" aria-hidden="true">
  <div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div>
  <svg class="spark s1"><use href="#star"/></svg>
  <svg class="spark s2"><use href="#star"/></svg>
  <svg class="spark s3"><use href="#star"/></svg>
</div>

<div class="wrap">
  <header class="top glass">
    <span class="wordmark sm" aria-label="DATOVA">DAT<svg class="logo-o" viewBox="0 0 100 100" data-mark></svg>VA</span>
    <button class="lang" id="langBtn" type="button">EN</button>
  </header>

  <!-- ===== upload view ===== -->
  <main id="uploadView">
    <section class="hero">
      <h1><span data-i18n="heroPre"></span> <em data-i18n="heroTitle"></em></h1>
      <p data-i18n="heroSub"></p>
    </section>

    <section class="upload glass">
      <label class="drop" id="drop" for="fileInput">
        <svg viewBox="0 0 54 54" aria-hidden="true">
          <rect x="5" y="30" width="10" height="19" rx="3" fill="url(#gO)" opacity=".55"/>
          <rect x="22" y="18" width="10" height="31" rx="3" fill="url(#gO)" opacity=".8"/>
          <rect x="39" y="6" width="10" height="43" rx="3" fill="url(#gO)"/>
        </svg>
        <strong data-i18n="dropTitle"></strong>
        <small data-i18n="dropHint"></small>
        <span class="btn ghost" style="margin-top:10px" data-i18n="choose"></span>
      </label>
      <input type="file" id="fileInput" accept=".csv,.xlsx">

      <div class="chosen" id="chosen">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7C5CFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
        <span class="name" id="fileName"></span>
        <span class="size" id="fileSize"></span>
      </div>
      <div class="actions" id="actions">
        <button class="btn" id="analyzeBtn" type="button" data-i18n="analyze"></button>
        <button class="btn ghost" id="clearBtn" type="button" data-i18n="change"></button>
      </div>
      <div class="error" id="error" role="alert"></div>
    </section>
  </main>

  <!-- ===== loading view ===== -->
  <section class="loading glass" id="loadingView" aria-live="polite">
    <svg class="logo-o" viewBox="0 0 100 100" data-mark data-live></svg>
    <ul class="steps" id="steps"></ul>
  </section>

  <!-- ===== results view ===== -->
  <section class="results" id="resultsView"></section>

  <footer>
    <span class="wordmark sm" aria-label="DATOVA">DAT<svg class="logo-o" viewBox="0 0 100 100" data-mark></svg>VA</span>
    <p>Discover What Data Hides.</p>
    <p data-i18n="footer"></p>
  </footer>
</div>

<script>
/* ============================================================
   إعدادات الربط بالـ backend
   - اذا فتحت الصفحه من نفس السيرفر (http://127.0.0.1:8000/) خلي API_BASE فارغ
   ============================================================ */
const API_BASE = "";   
const MAX_SIZE = 20 * 1024 * 1024;
const ALLOWED = [".csv", ".xlsx"];

const I18N = {
  ar: {
    heroPre: "حوّل بياناتك إلى",
    heroTitle: "رؤى حقيقية",
    heroSub: "ارفع ملف مبيعاتك أو بيانات مشروعك. DATOVA ينظّفها ويحلّلها ويقترح عليك خطوتك الجاية، بدون أي خبرة سابقة.",
    dropTitle: "اسحب الملف هنا",
    dropHint: "ملفات CSV أو XLSX بحجم أقصى 20 ميغابايت",
    choose: "اختر ملف",
    analyze: "حلّل بياناتي",
    change: "تغيير الملف",
    again: "حلّل ملف ثاني",
    pdf: "تحميل النتائج PDF",
    pdfBusy: "جاري التحضير...",
    errPdf: "ما كدرنا نجهّز ملف الـ PDF. جرب مرة ثانية.",
    steps: ["قراءة الملف", "فهم نوع مشروعك", "تنظيف البيانات", "تخطيط التحليل", "رسم المخططات", "كتابة الاستنتاجات والنصائح"],
    errType: "نوع الملف غير مدعوم. ارفع ملف CSV أو XLSX.",
    errSize: "حجم الملف أكبر من 20 ميغابايت.",
    errNet: "ما كدرنا نوصل للسيرفر. تأكد أن الـ backend شغّال وافتح الصفحة من عنوانه.",

function showError(msg) {
  const box = $("error");
  box.textContent = msg || "";
  box.classList.toggle("show", !!msg);
}
function humanSize(b) {
  return b > 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";
}
function setFile(file) {
  showError("");
  if (!file) return;
  const ext = "." + file.name.split(".").pop().toLowerCase();
  if (!ALLOWED.includes(ext)) return showError(t("errType"));
  if (file.size > MAX_SIZE) return showError(t("errSize"));
  chosenFile = file;
  $("fileName").textContent = file.name;
  $("fileSize").textContent = humanSize(file.size);
  $("chosen").classList.add("show");
  $("actions").classList.add("show");
}
function clearFile() {
  chosenFile = null;
  input.value = "";
  $("chosen").classList.remove("show");
  $("actions").classList.remove("show");
  showError("");
}

["dragleave", "drop"].forEach((ev) =>

/* ---------- العرض ---------- */
function show(view) {
  $("uploadView").style.display = view === "upload" ? "" : "none";
  $("loadingView").style.display = view === "loading" ? "block" : "none";
  $("resultsView").style.display = view === "results" ? "block" : "none";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* مراحل التحميل شكلية (الـ backend يرد مره وحده بالنهايه) */
function buildSteps(active = 0) {
  const ul = $("steps");
  ul.innerHTML = "";
  t("steps").forEach((label, i) => {
    const li = document.createElement("li");
    li.textContent = label;
    li.className = i < active ? "done" : i === active ? "active" : "";
    ul.appendChild(li);
  });
}
function startSteps() {
  let i = 0;
  buildSteps(0);
  stepTimer = setInterval(() => {
    i = Math.min(i + 1, t("steps").length - 1);
    buildSteps(i);
  }, 3500);
}
function stopSteps() { clearInterval(stepTimer); }

/* ---------- الاتصال بالـ backend ---------- */
async function analyze() {
  if (!chosenFile) return;
  showError("");
  show("loading");
  startSteps();

  const body = new FormData();
  body.append("file", chosenFile);

  try {
    const res = await fetch(API_BASE + "/upload", { method: "POST", body });
    let data = null;
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) {
      throw new Error(data && typeof data.detail === "string" ? data.detail : t("errGeneric"));
    }
    lastData = data;
    baseData = JSON.parse(JSON.stringify(data));
    resetFilter();
    renderResults(data);
    show("results");
  } catch (err) {
    showError(err instanceof TypeError ? t("errNet") : err.message);
    show("upload");
  } finally {
    stopSteps();
  }
}

/* ---------- تحميل النتائج PDF ---------- */
async function downloadPdf(btn) {
  if (!lastData) return;
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = t("pdfBusy");
  try {
    const res = await fetch(API_BASE + "/export-pdf", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify((({ filter_meta, ...rest }) => ({ ...rest, lang }))(lastData)),
    });
    if (!res.ok) {
      let d = null;
      try { d = await res.json(); } catch (e) {}
      throw new Error(d && typeof d.detail === "string" ? d.detail : t("errPdf"));
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "datova-report.pdf";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (err) {
    alert(err instanceof TypeError ? t("errNet") : err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
}
$("analyzeBtn").addEventListener("click", analyze);

/* ---------- بناء النتائج (textContent فقط، حتى ما ينحقن اي شي من الـ AI) ---------- */
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function svgEl(tag, attrs) {
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

function hBars(labels, values) {
  const box = el("div");
  const max = Math.max(...values.map((v) => Math.abs(v)), 1);
  labels.forEach((l, i) => {
    const row = el("div", "hbar");
    const lab = el("span", "hb-label", l); lab.title = l;
    const track = el("div", "hb-track");
    const bar = el("i", values[i] < 0 ? "neg" : "");
    track.appendChild(bar);
    row.append(lab, track, el("b", "hb-val", fmt(values[i])));
    box.appendChild(row);
    requestAnimationFrame(() => requestAnimationFrame(() => (bar.style.width = (Math.abs(values[i]) / max) * 100 + "%")));
  });
  return box;
}

function vBars(labels, values) {
  const box = el("div", "vbars");
  const max = Math.max(...values.map((v) => Math.abs(v)), 1);
  const step = labels.length > 12 ? 2 : 1;
  labels.forEach((l, i) => {
    const col = el("div", "vb");
    const plot = el("div", "vb-plot");
    const bar = el("i");
    bar.title = l + ": " + fmt(values[i]);
    plot.appendChild(bar);
    const p = l.split("-");
    const short = p.length === 3 ? p[2] + "/" + p[1] : p[1] + "/" + p[0].slice(2);
    col.append(plot, el("span", "", i % step === 0 ? short : ""));
    box.appendChild(col);
    requestAnimationFrame(() => requestAnimationFrame(() => (bar.style.height = (Math.abs(values[i]) / max) * 100 + "%")));
  });
  return box;
}

const PIE_COLORS = ["#9B87F5", "#F4A9C6", "#8FD3F4", "#C9B8FF", "#B8B9C6", "#E7C6F0"];
function donut(labels, values) {
  const wrap = el("div", "donut-wrap");
  const total = values.reduce((a, b) => a + b, 0) || 1;
  const svg = svgEl("svg", { viewBox: "0 0 42 42", role: "img" });
  svg.appendChild(svgEl("circle", { cx: 21, cy: 21, r: 15.915, fill: "none", stroke: "#ECE6F7", "stroke-width": 6 }));
  const legend = el("ul", "legend");
  let offset = 25;
  values.forEach((v, i) => {
    const pct = (v / total) * 100;
    const color = PIE_COLORS[i % PIE_COLORS.length];
    const seg = svgEl("circle", {
      cx: 21, cy: 21, r: 15.915, fill: "none", stroke: color, "stroke-width": 6,
      "stroke-dasharray": `${Math.max(pct - 0.6, 0)} ${100 - Math.max(pct - 0.6, 0)}`,
      "stroke-dashoffset": offset
    });
    svg.appendChild(seg);
    offset -= pct;
    const li = el("li");
    const dot = el("i"); dot.style.background = color;
    const l = el("span", "l", labels[i]); l.title = labels[i];
    li.append(dot, l, el("span", "p", pct.toFixed(1) + "%"));
    legend.appendChild(li);
  });
  wrap.append(svg, legend);
  return wrap;
}

function chartCard(a, i, editable) {
  const card = el("article", "card glass");
  const head = el("div", "chead");
  head.appendChild(el("h3", "", a.title));
  if (editable && a.spec) {
    const tools = el("div", "ctools");
    const ed = el("button", "fx", "✎");
    ed.type = "button";
    ed.title = t("editChart");
    ed.addEventListener("click", () => {
      dState.form = { mode: "edit", index: i, spec: { ...a.spec, value: a.spec.value || "", title: a.spec.title || a.title } };
      renderResults(lastData);
      scrollToForm();
    });
    const rm = el("button", "fx", "×");
    rm.type = "button";
    rm.title = t("removeChart");
    rm.addEventListener("click", () => {
      dState.form = null;
      lastData = { ...lastData, analyses: lastData.analyses.filter((_, j) => j !== i) };
      renderResults(lastData);
    });
    tools.append(ed, rm);
    head.appendChild(tools);
  }
  card.appendChild(head);
  const isTime = a.labels.length > 1 && a.labels.every((l) => /^\d{4}-\d{2}(-\d{2})?$/.test(l));
  if (a.chart === "pie") card.appendChild(donut(a.labels, a.values));
  else card.appendChild(isTime ? vBars(a.labels, a.values) : hBars(a.labels, a.values));
  return card;
}
function listCard(title, items, kind, opts = {}) {

/* ---------- الفلتر ---------- */
let baseData = null;
let fState = { rows: [], hidden: [], gran: "", dateCol: "", open: false };
function resetFilter() {
  fState = { rows: [], hidden: [], gran: "", dateCol: "", open: false };
  dState = { form: null, askText: "", advice: false, goal: "" };
}

const F_OPS = {
  category: [["in", "showOnly"], ["not_in", "hide"]],
  text: [["contains", "contains"], ["not_contains", "notContains"]],
  numeric: [["between", "between"]],
  date: [["between", "between"]]
};
const colOf = (meta, name) => (meta.columns || []).find((c) => c.name === name);
const blankRow = (c) => ({ column: c.name, op: F_OPS[c.kind][0][0], values: [], min: "", max: "", start: "", end: "", text: "" });

function fSelect(options, value, onChange) {
  const s = el("select", "fsel");
  options.forEach(([v, label]) => {
    const o = el("option", "", label);
    o.value = v;
    if (v === value) o.selected = true;
    s.appendChild(o);
  });
  s.addEventListener("change", () => onChange(s.value));
  return s;
}
function fInput(type, value, ph, onInput, attrs) {
  const i = el("input", "finp");
  i.type = type;
  i.value = value;
  if (ph) i.placeholder = ph;
  Object.entries(attrs || {}).forEach(([k, v]) => i.setAttribute(k, v));
  i.addEventListener("input", () => onInput(i.value));
  return i;
}
function labeled(text, input) {
  const l = el("label", "flab");
  l.append(el("span", "", text), input);
  return l;
}

function filterRow(meta, row, rebuild) {
  const c = colOf(meta, row.column) || meta.columns[0];
  const box = el("div", "frow");
  box.appendChild(fSelect(meta.columns.map((x) => [x.name, x.name]), row.column, (v) => {
    Object.assign(row, blankRow(colOf(meta, v)));
    rebuild();
  }));
  const ops = F_OPS[c.kind];
  box.appendChild(ops.length > 1
    ? fSelect(ops.map(([v, k]) => [v, t(k)]), row.op, (v) => { row.op = v; })
    : el("span", "fop", t(ops[0][1])));

  const val = el("div", "fval");
  if (c.kind === "category") {
    const list = el("div", "fvals");
    const search = fInput("search", "", t("search"), (q) => {
      list.querySelectorAll("label").forEach((lb) => {
        lb.style.display = lb.dataset.v.toLowerCase().includes(q.toLowerCase()) ? "" : "none";
      });
    });
    c.values.forEach((v) => {
      const lb = el("label");
      lb.dataset.v = v;
      const cb = el("input");
      cb.type = "checkbox";
      cb.checked = row.values.includes(v);
      cb.addEventListener("change", () => {
        row.values = cb.checked ? [...row.values, v] : row.values.filter((x) => x !== v);
      });
      lb.append(cb, el("span", "", v));
      list.appendChild(lb);
    });
    val.append(search, list);
  } else if (c.kind === "numeric") {
    val.append(
      labeled(t("min"), fInput("number", row.min, fmt(c.min), (v) => (row.min = v), { step: "any" })),
      labeled(t("max"), fInput("number", row.max, fmt(c.max), (v) => (row.max = v), { step: "any" }))
    );
  } else if (c.kind === "date") {
    val.append(
      labeled(t("from"), fInput("date", row.start, "", (v) => (row.start = v), { min: c.min, max: c.max })),
      labeled(t("to"), fInput("date", row.end, "", (v) => (row.end = v), { min: c.min, max: c.max }))
    );
  } else {
    val.appendChild(fInput("text", row.text, t("typeText"), (v) => (row.text = v)));
  }
  box.appendChild(val);

  const x = el("button", "fx", "×");
  x.type = "button";
  x.title = t("remove");
  x.addEventListener("click", () => { fState.rows.splice(fState.rows.indexOf(row), 1); rebuild(); });
  box.appendChild(x);
  return box;
}

function buildFilterPanel(d) {
  const meta = d.filter_meta;
  const panel = el("section", "fpanel glass");
  const head = el("div", "fhead");
  const toggle = el("button", "btn ghost", fState.open ? t("close") : t("open"));
  toggle.type = "button";
  head.append(el("h3", "", t("filterTitle")), toggle);
  const body = el("div", fState.open ? "fbody open" : "fbody");
  toggle.addEventListener("click", () => {
    fState.open = !fState.open;
    body.classList.toggle("open", fState.open);
    toggle.textContent = fState.open ? t("close") : t("open");
  });

  // شروط الفلتر (كل شرط: عمود + نوع الشرط + القيم)
  const rowsBox = el("div", "frows");
  const rebuild = () => {
    rowsBox.innerHTML = "";
    fState.rows.forEach((r) => rowsBox.appendChild(filterRow(meta, r, rebuild)));
  };
  rebuild();
  const add = el("button", "btn ghost", "+ " + t("addFilter"));
  add.type = "button";
  add.style.alignSelf = "flex-start";
  add.addEventListener("click", () => {
    if (meta.columns.length) { fState.rows.push(blankRow(meta.columns[0])); rebuild(); }
  });
  body.append(rowsBox, add);

  // التجميع الزمني: يومي / أسبوعي / شهري
  if ((meta.date_columns || []).length) {
    const g = el("div", "fgroup");
    g.appendChild(el("h4", "", t("granTitle")));
    const pills = el("div", "fgran");
    [["", "granNone"], ["day", "day"], ["week", "week"], ["month", "month"]].forEach(([v, k]) => {
      const b = el("button", "pill" + (fState.gran === v ? " on" : ""), t(k));
      b.type = "button";
      b.addEventListener("click", () => {
        fState.gran = v;
        pills.querySelectorAll(".pill").forEach((p) => p.classList.remove("on"));
        b.classList.add("on");
      });
      pills.appendChild(b);
    });
    g.appendChild(pills);
    if (meta.date_columns.length > 1) {
      const sel = fSelect(meta.date_columns.map((c) => [c, c]), fState.dateCol || meta.date_columns[0], (v) => (fState.dateCol = v));
      sel.style.marginTop = "8px";
      g.appendChild(sel);
    }
    body.appendChild(g);
  }

  // إخفاء أعمدة من التحليل
  const hg = el("div", "fgroup");
  hg.appendChild(el("h4", "", t("hideCols")));
  const chips = el("div", "fchips");
  (meta.all_columns || []).forEach((name) => {
    const lb = el("label");
    const cb = el("input");
    cb.type = "checkbox";
    cb.checked = fState.hidden.includes(name);
    cb.addEventListener("change", () => {
      fState.hidden = cb.checked ? [...fState.hidden, name] : fState.hidden.filter((x) => x !== name);
    });
    lb.append(cb, el("span", "", name));
    chips.appendChild(lb);
  });
  hg.appendChild(chips);
  body.appendChild(hg);

  const err = el("div", "error");
  const apply = el("button", "btn", t("apply"));
  apply.type = "button";
  apply.addEventListener("click", () => applyFilter(d, apply, err));
  const reset = el("button", "btn ghost", t("reset"));
  reset.type = "button";
  reset.addEventListener("click", () => {
    resetFilter();
    fState.open = true;
    lastData = baseData;
    renderResults(lastData);
  });
  const actions = el("div", "factions");
  actions.append(apply, reset);
  body.append(actions, err);

  panel.append(head, body);
  return panel;
}

/* ---------- لوحة المعلومات المخصصة ---------- */
let dState = { form: null, askText: "", advice: false, goal: "" };
let curMsg = null;

function filterPayload(meta) {
  const filters = [];
  fState.rows.forEach((r) => {
    const c = colOf(meta, r.column);
    if (!c) return;
    if (c.kind === "category") {
      if (r.values.length) filters.push({ column: r.column, op: r.op, values: r.values });
    } else if (c.kind === "text") {
      if (r.text.trim()) filters.push({ column: r.column, op: r.op, value: r.text.trim() });
    } else if (c.kind === "numeric") {
      const f = { column: r.column, op: "between" };
      if (r.min !== "") f.min = Number(r.min);
      if (r.max !== "") f.max = Number(r.max);
      if (f.min !== undefined || f.max !== undefined) filters.push(f);
    } else if (c.kind === "date") {
      const f = { column: r.column, op: "between" };
      if (r.start) f.start = r.start;
      if (r.end) f.end = r.end;
      if (f.start || f.end) filters.push(f);
    }
  });
  return { filters, hidden_columns: fState.hidden, granularity: fState.gran || null, date_column: fState.dateCol || null };
}
const currentSpecs = (d) => (d.analyses || []).map((a) => a.spec).filter(Boolean);
const keepInfo = (fi) => (fi && (fi.descriptions || []).length ? fi : undefined);

async function api(path, body) {
  const res = await fetch(API_BASE + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error(data && typeof data.detail === "string" ? data.detail : t("errGeneric"));
  return data;
}
function showMsg(text, isError, box) {
  const b = box || curMsg;
  if (!b) return;
  b.className = (isError ? "error" : "okmsg") + " show";
  b.textContent = text;
}
async function guarded(btn, work, box) {
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = t("working");
  try { await work(); }
  catch (err) { showMsg(err instanceof TypeError ? t("errNet") : err.message, true, box); }
  finally { btn.disabled = false; btn.textContent = label; }
}
const scrollToForm = () => { const f = document.querySelector(".dform"); if (f) f.scrollIntoView({ behavior: "smooth", block: "center" }); };

/* إذا المستخدم اختار يومي/أسبوعي/شهري وما اكو مخطط زمني، نضيف واحد */
function ensureTrend(specs, d) {
  const meta = d.filter_meta;
  if (!fState.gran || !(meta.date_columns || []).length || specs.some((s) => s.kind === "monthly_trend")) return specs;
  const v = (specs.find((s) => s.value) || {}).value || null;
  return [...specs, { kind: "monthly_trend", group_by: fState.dateCol || meta.date_columns[0], value: v, agg: v ? "sum" : "count", top_n: 10, chart: "bar", title: t("trendTitle") }];
}

async function applyFilter(d, btn, errBox) {
  errBox.classList.remove("show");
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = t("applying");
  try {
    const data = await api("/filter", {
      upload_id: d.upload_id, ...filterPayload(d.filter_meta),
      specs: ensureTrend(currentSpecs(d), d), refresh_insights: true, lang
    });
    lastData = { ...d, analyses: data.analyses, filter_info: keepInfo(data.filter_info), problems: undefined, insights_stale: !!data.insights_error };
    if (!data.insights_error) {
      Object.assign(lastData, { summary: data.summary, insights: data.insights, recommendations: data.recommendations, dismissed: [] });
    }
    renderResults(lastData);
    if ((data.skipped || []).length) showMsg(`${t("skippedCharts")}: ${data.skipped.join("، ")}`, true);
  } catch (err) {
    errBox.textContent = err instanceof TypeError ? t("errNet") : err.message;
    errBox.classList.add("show");
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
}

/* يعيد رسم المخططات حسب القائمة الجديدة (بدون ذكاء اصطناعي) */
async function refreshDashboard(d, specs) {
  const data = await api("/filter", { upload_id: d.upload_id, ...filterPayload(d.filter_meta), specs, refresh_insights: false, lang });
  lastData = { ...d, analyses: data.analyses, filter_info: keepInfo(data.filter_info) };
  renderResults(lastData);
  if ((data.skipped || []).length) showMsg(`${t("skippedCharts")}: ${data.skipped.join("، ")}`, true);
}

/* ---- نموذج إضافة/تعديل مخطط ---- */
const visibleCols = (meta, kinds) => meta.columns.filter((c) => kinds.includes(c.kind) && !fState.hidden.includes(c.name));
const labeledSel = (text, options, value, onChange) => labeled(text, fSelect(options, value, onChange));
function blankSpec(meta) {
  const g = visibleCols(meta, ["category", "numeric"])[0];
  return { kind: "group_agg", group_by: g ? g.name : "", value: "", agg: "count", top_n: 10, chart: "bar", title: "" };
}
function normalizeSpec(s) {
  return {
    kind: s.kind, group_by: s.group_by, value: s.value || null, agg: s.value ? s.agg : "count",
    top_n: Math.max(1, Math.min(15, Number(s.top_n) || 10)), chart: s.kind === "monthly_trend" ? "bar" : s.chart, title: (s.title || "").trim()
  };
}
function chartForm(d) {
  const meta = d.filter_meta, f = dState.form, s = f.spec;
  const box = el("div", "dform glass");
  const rebuild = () => box.replaceWith(chartForm(d));
  const dates = visibleCols(meta, ["date"]);
  const isTrend = s.kind === "monthly_trend";
  const grid = el("div", "dgrid");
  const kinds = [["group_agg", t("kindGroup")]];
  if (dates.length) kinds.push(["monthly_trend", t("kindTrend")]);
  grid.appendChild(labeledSel(t("fieldKind"), kinds, s.kind, (v) => {
    s.kind = v;
    s.group_by = ((v === "monthly_trend" ? dates : visibleCols(meta, ["category", "numeric"]))[0] || {}).name || "";
    rebuild();
  }));
  const gOpts = (isTrend ? dates : visibleCols(meta, ["category", "numeric"])).map((c) => [c.name, c.name]);
  grid.appendChild(labeledSel(isTrend ? t("fieldDate") : t("fieldGroup"), gOpts, s.group_by, (v) => (s.group_by = v)));
  grid.appendChild(labeledSel(t("fieldValue"), [["", t("countRows")], ...visibleCols(meta, ["numeric"]).map((c) => [c.name, c.name])], s.value || "", (v) => {
    s.value = v;
    s.agg = v ? (s.agg === "count" ? "sum" : s.agg) : "count";
    rebuild();
  }));
  if (s.value) {
    grid.appendChild(labeledSel(t("fieldAgg"), [["sum", t("aggSum")], ["mean", t("aggMean")], ["max", t("aggMax")], ["min", t("aggMin")]], s.agg, (v) => (s.agg = v)));
  }
  if (!isTrend) {
    grid.appendChild(labeledSel(t("fieldChart"), [["bar", t("chartBar")], ["pie", t("chartPie")]], s.chart, (v) => (s.chart = v)));
    grid.appendChild(labeled(t("fieldTop"), fInput("number", String(s.top_n), "", (v) => (s.top_n = v), { min: "1", max: "15" })));
  }
  grid.appendChild(labeled(t("fieldTitle"), fInput("text", s.title || "", "", (v) => (s.title = v))));
  const ok = el("button", "btn", f.mode === "edit" ? t("formSave") : t("formAdd"));
  ok.type = "button";
  ok.addEventListener("click", () => guarded(ok, async () => {
    if (!s.group_by) throw new Error(t("errGeneric"));
    const specs = (d.analyses || []).map((a) => a.spec);
    if (f.mode === "edit") specs[f.index] = normalizeSpec(s); else specs.push(normalizeSpec(s));
    dState.form = null;
    await refreshDashboard(d, specs.filter(Boolean));
  }));
  const cancel = el("button", "btn ghost", t("cancel"));
  cancel.type = "button";
  cancel.addEventListener("click", () => { dState.form = null; renderResults(d); });
  const acts = el("div", "factions");
  acts.append(ok, cancel);
  box.append(grid, acts);
  return box;
}

/* ---- شريط المخططات: مخطط جديد / طلب بالكتابة / استعادة ---- */
function buildDashBar(d) {
  const wrap = el("div", "dbar");
  const row = el("div", "dbtns");
  const add = el("button", "btn ghost sm", "+ " + t("addChart"));
  add.type = "button";
  add.addEventListener("click", () => { dState.form = { mode: "add", index: -1, spec: blankSpec(d.filter_meta) }; renderResults(d); scrollToForm(); });
  const restore = el("button", "btn ghost sm", t("restoreCharts"));
  restore.type = "button";
  restore.addEventListener("click", () => guarded(restore, async () => {
    dState.form = null;
    await refreshDashboard(d, baseData.analyses.map((a) => a.spec).filter(Boolean));
  }));
  row.append(add, restore);

  const ask = el("div", "dask");
  const inp = fInput("text", dState.askText, t("askPlaceholder"), (v) => (dState.askText = v));
  const go = el("button", "btn sm", t("askBtn"));
  go.type = "button";
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") go.click(); });
  go.addEventListener("click", () => guarded(go, async () => {
    const text = dState.askText.trim();
    if (!text) return;
    const data = await api("/ask-analysis", { upload_id: d.upload_id, ...filterPayload(d.filter_meta), request: text, lang });
    dState.askText = "";
    lastData = { ...d, analyses: [...d.analyses, data.analysis] };
    renderResults(lastData);
    if (data.note) showMsg(data.note, false);
  }));
  ask.append(inp, go);

  curMsg = el("div", "okmsg");
  wrap.append(row, ask);
  if (dState.form) wrap.appendChild(chartForm(d));
  wrap.appendChild(curMsg);
  return wrap;
}

function problemsCard(d) {
  const sevLabel = { high: t("sevHigh"), medium: t("sevMed"), low: t("sevLow") };
  const card = el("article", "card glass");
  const hd = el("div", "lhead");
  hd.append(el("h3", "", t("problemsTitle")), el("span", "note", d.problems_source === "ai" ? t("srcAi") : t("srcRules")));
  card.appendChild(hd);
  const list = el("div", "plist");
  (d.problems || []).forEach((p, i) => {
    const row = el("div", "prob");
    const top = el("div", "ptop");
    top.append(el("span", "sev " + p.severity, sevLabel[p.severity] || ""), el("b", "", p.title));
    const x = el("button", "fx", "×");
    x.type = "button";
    x.title = t("removeItem");
    x.addEventListener("click", () => { lastData = { ...d, problems: d.problems.filter((_, j) => j !== i) }; renderResults(lastData); });
    top.appendChild(x);
    row.append(top, el("p", "", p.detail));
    if (p.fix) row.appendChild(el("p", "pfix", `${t("fix")}: ${p.fix}`));
    list.appendChild(row);
  });
  if (!(d.problems || []).length) list.appendChild(el("p", "", t("noProblems")));
  card.appendChild(list);
  return card;
}

function renderResults(d) {
  const root = $("resultsView");
  root.innerHTML = "";
  const rep = d.cleaning_report || {};

  const head = el("div", "res-head");
  const chip = el("span", "chip");
  chip.append(el("small", "", t("business")), document.createTextNode(d.business_type || "-"));
  const again = el("button", "btn ghost", t("again"));
  again.type = "button";
  again.addEventListener("click", () => { lastData = null; baseData = null; resetFilter(); root.innerHTML = ""; clearFile(); show("upload"); });

  const pdfBtn = el("button", "btn", t("pdf"));
  pdfBtn.type = "button";
  pdfBtn.addEventListener("click", () => downloadPdf(pdfBtn));

  const btns = el("div", "res-btns");
  btns.append(pdfBtn, again);

  head.append(chip, btns);
  root.appendChild(head);

  if (d.filter_meta) root.appendChild(buildFilterPanel(d));
  if (d.filter_info) {
    const fi = d.filter_info;
    const fn = el("div", "notes");
    fn.appendChild(el("span", "note", `${t("rowsAfterFilter")}: ${fmt(fi.rows_after)} ${t("of")} ${fmt(fi.rows_before)}`));
    (fi.descriptions || []).forEach((x) => fn.appendChild(el("span", "note", x)));
    if (d.insights_stale) fn.appendChild(el("span", "note warn", t("staleInsights")));
    root.appendChild(fn);
  }

  if (d.summary) {
    const sum = el("section", "summary glass");
    sum.append(el("h2", "", t("summary")), el("p", "", d.summary));
    root.appendChild(sum);
  }

  const stats = el("div", "stats");
  stats.append(
    statCard(t("rowsAnalyzed"), fmt(rep.rows_after ?? 0), `${t("of")} ${fmt(rep.rows_before ?? 0)}`),
    statCard(t("dups"), fmt(rep.duplicates_removed ?? 0)),
    statCard(t("missing"), fmt(rep.dropped_rows_missing ?? 0)),
    statCard(t("cols"), fmt(rep.columns_after ?? 0), `${t("of")} ${fmt(rep.columns_before ?? 0)}`)
  );
  root.appendChild(stats);

  const notes = el("div", "notes");
  Object.entries(rep.filled_columns || {}).forEach(([col, how]) =>
    notes.appendChild(el("span", "note", `${t("filled")}: ${col} (${t(how) || how})`)));
  (rep.dropped_columns || []).forEach((col) =>
    notes.appendChild(el("span", "note warn", `${t("dropped")}: ${col}`)));
  root.appendChild(notes);

  root.appendChild(el("h2", "sec-title", t("charts")));
  if (d.filter_meta) root.appendChild(buildDashBar(d));
  const grid = el("div", "charts");
  (d.analyses || []).forEach((a, i) => grid.appendChild(chartCard(a, i, !!d.filter_meta)));
  root.appendChild(grid);

  const two = el("div", "two");
  two.style.marginTop = "18px";
  const editable = !!d.filter_meta;
  const bMsg = el("div", "okmsg");
  const insOpts = {}, recOpts = {};
  if (editable) {
    insOpts.onRemove = (i) => { lastData = { ...d, insights: d.insights.filter((_, j) => j !== i) }; renderResults(lastData); };
    recOpts.onRemove = (i) => {
      lastData = { ...d, recommendations: d.recommendations.filter((_, j) => j !== i), dismissed: [...(d.dismissed || []), d.recommendations[i]] };
      renderResults(lastData);
    };
    const pb = el("button", "btn ghost sm", t("findProblems"));
    pb.type = "button";
    pb.addEventListener("click", () => guarded(pb, async () => {
      const data = await api("/find-problems", { upload_id: d.upload_id, ...filterPayload(d.filter_meta), specs: currentSpecs(d), lang });
      lastData = { ...d, problems: data.problems, problems_source: data.source };
      renderResults(lastData);
    }, bMsg));
    insOpts.actions = [pb];
    const ab = el("button", "btn ghost sm", t("betterAdvice"));
    ab.type = "button";
    ab.addEventListener("click", () => { dState.advice = !dState.advice; renderResults(d); });
    recOpts.actions = [ab];
    if (dState.advice) {
      const arow = el("div", "dask");
      arow.style.marginBottom = "12px";
      const gi = fInput("text", dState.goal, t("goalPlaceholder"), (v) => (dState.goal = v));
      const gb = el("button", "btn sm", t("suggest"));
      gb.type = "button";
      gb.addEventListener("click", () => guarded(gb, async () => {
        const data = await api("/advice", {
          upload_id: d.upload_id, ...filterPayload(d.filter_meta), specs: currentSpecs(d),
          goal: dState.goal.trim() || null, exclude: d.dismissed || [], lang
        });
        lastData = { ...d, recommendations: data.recommendations };
        renderResults(lastData);
      }, bMsg));
      arow.append(gi, gb);
      recOpts.extra = arow;
    }
  }
  two.append(listCard(t("insights"), d.insights, "insight", insOpts), listCard(t("recs"), d.recommendations, "rec", recOpts));
  root.appendChild(two);
  if (editable) root.appendChild(bMsg);
  if (d.problems) { const pc = problemsCard(d); pc.style.marginTop = "18px"; root.appendChild(pc); }
}

applyLang();
show("upload");
</script>
</body>
</html>

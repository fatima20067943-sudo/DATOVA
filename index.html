<style>
:root{
  --ivory:#F6F3EE;
  --lavender:#C9C5D9;
  --white:#FFFFFF;
  --lilac:#8A7A45;
  --blue:#B8B8BC;
  --gray:#8E8C86;
  --ink:#1B1B1E;
  --body:#BDBAB0;
  --purple:#B8962E;
  --purple-2:#D4AF37;
  --glass:rgba(255,255,255,.58);
  --glass-line:rgba(255,255,255,.85);
  --shadow:0 18px 50px -20px rgba(0,0,0,.25);
  --radius:22px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;
  font-family:Inter,Cairo,system-ui,sans-serif;
  color:var(--body);background:var(--ivory);
  line-height:1.65;overflow-x:hidden;
}
:lang(ar) body,body:lang(ar){font-family:Cairo,Inter,system-ui,sans-serif}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--purple);outline-offset:3px;border-radius:8px}
/* ---------- background ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:
    radial-gradient(60% 50% at 12% 8%,rgba(212,175,55,0.45),transparent 45%),
    radial-gradient(50% 45% at 92% 18%,rgba(150,150,155,0.8),transparent 45%),
    radial-gradient(55% 50% at 80% 95%,rgba(212,175,55,0.35),transparent 45%),

    var(--ivory);}
.bubble{position:absolute;border-radius:50%;
  background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.95),rgba(212,175,55,.28) 42%,rgba(150,150,155,.22) 72%,rgba(150,150,155,.12));
  border:1px solid rgba(255,255,255,.7);
  box-shadow:inset -10px -14px 30px rgba(212,175,55,.18),0 20px 50px -25px rgba(212,175,55,.4);
  backdrop-filter:blur(3px)}
.b1{width:190px;height:190px;top:-50px;inset-inline-end:-40px}
.b2{width:120px;height:120px;bottom:12%;inset-inline-start:-30px}
.b3{width:70px;height:70px;top:46%;inset-inline-end:6%}
.spark{position:absolute;width:22px;height:22px;fill:#D4AF37;opacity:.85}
.s1{top:120px;inset-inline-start:9%}
.s2{top:38%;inset-inline-end:14%;width:14px;height:14px}
.s3{bottom:16%;inset-inline-end:30%;width:18px;height:18px}
/* ---------- layout ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:18px 20px 60px}
.glass{background:var(--glass);border:1px solid var(--glass-line);border-radius:var(--radius);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow)}
header.top{display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;border-radius:999px;margin-bottom:56px}
.wordmark{direction:ltr;unicode-bidi:isolate;display:inline-flex;align-items:center;
  font-family:Montserrat,sans-serif;font-weight:300;letter-spacing:.09em;
  background:linear-gradient(100deg,#1B1B1E 0%,#1B1B1E 60%,#6B6246 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.wordmark.sm{font-size:24px}
.wordmark.lg{font-size:54px}
.logo-o{height:1.9em;width:auto;margin:0 .04em;flex:none;object-fit:contain;filter:drop-shadow(0 0 6px rgba(212,175,55,.35))}
.logo-o.live{animation:logopulse 2.8s ease-in-out infinite}
@keyframes logopulse{50%{transform:scale(1.07);filter:drop-shadow(0 0 16px rgba(212,175,55,.65))}}
.lang{border:1px solid var(--glass-line);background:rgba(255,255,255,.7);color:var(--ink);
  padding:7px 16px;border-radius:999px;font-weight:600;font-size:14px}
.lang:hover{background:#fff}
/* ---------- hero ---------- */
.hero{max-width:720px;margin:0 auto 34px;text-align:center}
.hero h1{margin:0 0 14px;font-family:Montserrat,Cairo,sans-serif;font-weight:500;
  font-size:clamp(30px,6vw,52px);line-height:1.2;color:var(--ink);letter-spacing:.01em}
.hero h1 em{font-style:normal;white-space:nowrap;background:linear-gradient(100deg,#1B1B1E,#B8962E 55%,#D4AF37);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0 auto;max-width:560px;font-size:17px}
/* ---------- upload ---------- */
.upload{max-width:640px;margin:0 auto;padding:22px}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
  padding:38px 20px;border-radius:18px;border:1.5px dashed var(--lilac);
  background:linear-gradient(160deg,rgba(255,255,255,.5),rgba(233,230,244,.55));
  transition:background .2s,border-color .2s}
.drop.over{border-color:var(--purple);background:rgba(203,198,234,.4)}
.drop svg{width:54px;height:54px;margin-bottom:6px}
.drop strong{color:var(--ink);font-size:18px}
.drop small{color:var(--gray);font-size:14px}
.btn{border:0;border-radius:999px;padding:12px 28px;font-weight:600;font-size:16px;color:#fff;
  background:linear-gradient(120deg,#1B1B1E,#3A3626);box-shadow:0 10px 24px -10px rgba(0,0,0,.55);
  transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 14px 28px -10px rgba(212,175,55,.8)}
.btn.ghost{color:var(--purple);background:rgba(255,255,255,.75);box-shadow:none;border:1px solid var(--lilac)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.chosen{display:none;align-items:center;gap:12px;margin-top:16px;padding:12px 16px;border-radius:16px;
  background:rgba(255,255,255,.75);border:1px solid var(--glass-line)}
.chosen.show{display:flex}
.chosen .name{flex:1;min-width:0;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:start}
.chosen .size{color:var(--gray);font-size:14px;direction:ltr}
.actions{display:none;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.actions.show{display:flex}
.error{display:none;margin-top:16px;padding:14px 16px;border-radius:16px;
  background:rgba(150,150,155,.55);border:1px solid rgba(233,147,184,.6);color:#7A2148;font-weight:500}
.error.show{display:block}
/* ---------- loading ---------- */
.loading{display:none;max-width:460px;margin:20px auto 0;padding:36px 28px;text-align:center}
.loading .logo-o{height:120px;width:auto;margin:0 auto 18px;display:block}
.orbit-g{transform-box:view-box;transform-origin:50% 50%;animation:orbit 5s linear infinite}
.pulse{transform-box:view-box;transform-origin:50% 50%;animation:pulse 2.4s ease-in-out infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.25)}}
.steps{list-style:none;margin:0;padding:0;text-align:start;display:grid;gap:10px}
.steps li{display:flex;align-items:center;gap:12px;color:var(--gray);transition:color .3s}
.steps li::before{content:"";flex:none;width:12px;height:12px;border-radius:50%;
  border:2px solid var(--lilac);background:transparent;transition:all .3s}
.steps li.active{color:var(--ink);font-weight:600}
.steps li.active::before{background:var(--purple);border-color:var(--purple);box-shadow:0 0 0 5px rgba(212,175,55,.2)}
.steps li.done{color:var(--body)}
.steps li.done::before{background:var(--blue);border-color:var(--blue)}
/* ---------- results ---------- */
.results{display:none}
.res-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.res-btns{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;
  background:rgba(255,255,255,.75);border:1px solid var(--glass-line);color:var(--ink);font-weight:600}
.chip small{color:var(--gray);font-weight:500}
.summary{padding:24px 26px;margin-bottom:18px}
.summary h2,.card h3{margin:0 0 8px;color:var(--ink);font-family:Montserrat,Cairo,sans-serif;font-weight:600}
.summary h2{font-size:20px}
.summary p{margin:0;font-size:17px;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.stat{padding:16px 18px;border-radius:18px;background:rgba(255,255,255,.7);border:1px solid var(--glass-line)}
.stat small{display:block;color:var(--gray);font-size:13px}
.stat b{display:block;color:var(--ink);font-family:Montserrat,sans-serif;font-weight:500;font-size:26px;line-height:1.3}
.stat span{font-size:13px;color:var(--gray)}
.notes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.note{padding:5px 12px;border-radius:999px;font-size:13px;background:rgba(212,175,55,.8);color:var(--ink)}
.note.warn{background:rgba(150,150,155,.7)}
.sec-title{margin:30px 0 14px;color:var(--ink);font-family:Montserrat,Cairo,sans-serif;font-weight:600;font-size:20px}
.charts{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.card{padding:22px}
.charts .card:last-child:nth-child(odd){grid-column:1/-1}
.card h3{font-size:17px;margin-bottom:16px}
.hbar{display:grid;grid-template-columns:minmax(70px,30%) 1fr 84px;align-items:center;gap:10px;margin:9px 0;font-size:14px}
.hb-label{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-track{height:12px;border-radius:99px;background:rgba(212,175,55,.22);overflow:hidden}
.hb-track i{display:block;height:100%;border-radius:99px;width:0;
  background:linear-gradient(90deg,var(--lilac),var(--purple-2));transition:width .9s cubic-bezier(.2,.7,.2,1)}
.hb-track i.neg{background:linear-gradient(90deg,var(--pink),#B0B0B4)}
.hb-val{color:var(--body);font-weight:600;font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
.vbars{direction:ltr;display:flex;align-items:stretch;gap:4px;height:240px}
.vb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.vb-plot{flex:1;width:100%;display:flex;align-items:flex-end}
.vb-plot i{display:block;width:100%;height:0;min-height:2px;border-radius:8px 8px 3px 3px;
  background:linear-gradient(180deg,var(--purple-2),var(--lilac));transition:height .9s cubic-bezier(.2,.7,.2,1)}
.vb span{margin-top:6px;font-size:11px;color:var(--gray);white-space:nowrap;height:16px}
.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center}
.donut-wrap svg{width:190px;height:190px;flex:none;transform:none}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px;flex:1;min-width:150px}
.legend li{display:flex;align-items:center;gap:10px}
.legend i{width:12px;height:12px;border-radius:50%;flex:none}
.legend .l{flex:1;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .p{color:var(--gray);font-weight:600;direction:ltr}
.two{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.list li{display:flex;gap:12px;align-items:flex-start;color:var(--ink)}
.list svg{width:20px;height:20px;flex:none;margin-top:4px}
.again{text-align:center;margin-top:34px}
footer{margin-top:64px;text-align:center;color:var(--gray);font-size:14px}
footer .wordmark{margin-bottom:8px}
footer p{margin:2px 0}
/* ---------- الفلتر ---------- */
/* ---------- لوحة المعلومات المخصصة ---------- */
/* ---------- واجهة الترحيب ---------- */
.welcome{display:none;max-width:980px;margin:0 auto}
.top .wordmark{cursor:pointer}
.w-hero{text-align:center;padding:6px 0 30px}
.w-mark{height:130px;width:auto;margin:0 auto 14px;display:block}
.w-hero h1{margin:0 0 14px;font-family:Montserrat,Cairo,sans-serif;font-weight:500;font-size:clamp(32px,6.5vw,58px);line-height:1.2;color:var(--ink)}
.w-hero h1 em{font-style:normal;white-space:nowrap;background:linear-gradient(100deg,#F7EFD0,#E3C14F 55%,#C0C0C4);-webkit-background-clip:text;background-clip:text;color:transparent}
.w-sub{max-width:660px;margin:0 auto 26px;font-size:18px;color:var(--body)}
.w-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn.big{padding:15px 38px;font-size:18px}
.w-badges{list-style:none;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:26px 0 0;padding:0}
.w-badges li{padding:6px 14px;border-radius:999px;font-size:14px;background:rgba(255,255,255,.06);border:1px solid var(--glass-line);color:var(--body)}
.w-continue{display:none;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 22px;margin:0 auto 24px;max-width:600px;text-align:start}
.w-continue small{display:block;color:var(--gray);font-size:13px}
.w-continue b{color:var(--ink);font-size:17px}
.w-h{margin:46px 0 18px;text-align:center;color:var(--ink);font-family:Montserrat,Cairo,sans-serif;font-weight:600;font-size:clamp(22px,4vw,30px)}
.w-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.w-card{padding:24px}
.w-num{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:#fff;background:linear-gradient(120deg,#9C7A1A,#C9A227);margin-bottom:14px}
.w-card h3,.w-feat h3{margin:0 0 6px;font-size:19px;color:var(--ink)}
.w-card p,.w-feat p{margin:0;color:var(--body);font-size:15.5px}
.w-feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.w-feat{padding:22px}
.w-ico{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;background:rgba(212,175,55,.16);color:var(--purple-2)}
.w-ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.w-prep{padding:26px;margin-top:42px}
.w-prep h3{margin:0 0 12px;color:var(--ink);font-size:20px}
.w-prep ul{margin:0 0 16px;padding-inline-start:22px;color:var(--body);display:grid;gap:6px}
.w-privacy{margin:0;padding-top:14px;border-top:1px solid var(--glass-line);font-size:14.5px;color:var(--gray)}
.w-final{text-align:center;margin:38px 0 6px}
@keyframes wrise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.welcome>*{animation:wrise .6s ease both}
.welcome>*:nth-child(2){animation-delay:.08s}
.welcome>*:nth-child(3){animation-delay:.14s}
.welcome>*:nth-child(4){animation-delay:.2s}
@media (prefers-reduced-motion:reduce){.welcome>*{animation:none}}
/* ---------- تحليلاتي ---------- */
.hbtns{display:flex;gap:8px}
.hist{margin-top:8px}
.hlist{display:grid;gap:12px;margin-top:14px}
.hitem{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:16px 20px}
.hinfo{min-width:0;flex:1}
.hinfo b{display:block;color:var(--ink);font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hinfo span{color:var(--gray);font-size:14px}
.hbtns2{display:flex;gap:8px}
.trow{display:flex;align-items:center;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.trow .flab{flex:1;min-width:220px}
.savestate{font-size:13px;color:var(--gray);min-height:1em}
.chead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ctools{display:flex;gap:2px;flex:none}
.dbar{display:grid;gap:12px;margin:0 0 16px}
.dbtns,.dask{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dask .finp{flex:1;min-width:200px}
.dform{padding:16px 18px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:12px}
.dgrid .flab{flex-direction:column;align-items:stretch;gap:4px}
.okmsg{display:none;padding:12px 16px;border-radius:16px;background:rgba(212,175,55,.7);border:1px solid var(--glass-line);color:var(--ink)}
.okmsg.show{display:block}
.lhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.lhead h3{margin:0}
.btn.sm{padding:7px 16px;font-size:14px}
.list .fx{margin-inline-start:auto}
.plist{display:grid;gap:12px}
.prob{padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.7);border:1px solid var(--glass-line)}
.prob p{margin:6px 0 0;color:var(--ink)}
.prob .pfix{color:var(--body)}
.ptop{display:flex;align-items:center;gap:10px}
.ptop b{flex:1;color:var(--ink)}
.sev{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;flex:none}
.sev.high{background:rgba(150,150,155,.85);color:#7A2148}
.sev.medium{background:rgba(255,226,170,.8);color:#7A5A00}
.sev.low{background:rgba(212,175,55,.95);color:var(--ink)}
.fpanel{padding:18px 22px;margin:0 0 18px}
.fhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fhead h3{margin:0;font-size:18px;color:var(--ink);font-family:Montserrat,Cairo,sans-serif;font-weight:600}
.fbody{display:none;flex-direction:column;gap:16px;margin-top:16px}
.fbody.open{display:flex}
.frows{display:grid;gap:10px}
.frow{display:grid;grid-template-columns:minmax(120px,1fr) minmax(110px,.7fr) 2fr auto;gap:10px;align-items:start;
  padding:12px;border-radius:16px;background:rgba(255,255,255,.7);border:1px solid var(--glass-line)}
.fsel,.finp{width:100%;padding:9px 12px;border-radius:12px;border:1px solid var(--lilac);background:#fff;color:var(--ink);font:inherit;font-size:15px}
.fop{padding:9px 4px;color:var(--gray);font-size:15px}
.fval{display:grid;gap:8px;min-width:0}
.fvals{max-height:140px;overflow:auto;display:grid;gap:4px;padding:6px 4px}
.fvals label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)}
.flab{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--gray)}
.flab .finp{flex:1}
.fx{border:0;background:transparent;color:var(--gray);font-size:24px;line-height:1;padding:4px 8px}
.fx:hover{color:var(--ink)}
.fgroup h4{margin:0 0 8px;font-size:15px;color:var(--ink)}
.fgran,.fchips{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--lilac);background:rgba(255,255,255,.75);color:var(--ink);padding:6px 14px;border-radius:999px;font-size:14px}
.pill.on{background:var(--purple);border-color:var(--purple);color:#fff}
.fchips label{display:inline-flex;gap:6px;align-items:center;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.75);
  border:1px solid var(--glass-line);font-size:14px;color:var(--ink)}
.factions{display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:820px){.frow{grid-template-columns:1fr}}
@media (max-width:820px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .charts,.two{grid-template-columns:1fr}
  .wordmark.lg{font-size:40px}
  header.top{margin-bottom:36px}
}
@media (prefers-reduced-motion:reduce){
  .orbit-g,.pulse,.logo-o.live{animation:none}
  .hb-track i,.vb-plot i{transition:none}
}
.bubble,
.b1,
.b2,
.b3{
  display: none !important;
}
/* =====================================================================
   الثيم الغامق: خلفية كحلية عميقة مع لمسات فاتحة (لافندر، أزرق جليدي، وردي)
   كل الألوان من هذي المتغيرات، غيّرها من مكان واحد
   ===================================================================== */
:root{
  --ivory:#0C0C0E;            /* الخلفية */
  --lavender:#2C2C30;
  --white:#FFFFFF;
  --lilac:#6B6246;            /* حدود الحقول والأزرار */
  --blue:#C0C0C4;             /* لمسة فاتحة: أزرق جليدي */
  --pink:#9A9A9E;             /* لمسة فاتحة: وردي */
  --gray:#9C9A93;             /* نص ثانوي */
  --ink:#F3F0E8;              /* النص الرئيسي (فاتح) */
  --body:#BDBAB0;
  --purple:#D4AF37;           /* اللون الأساسي (لافندر فاتح) */
  --purple-2:#EBCB6B;
  --glass:rgba(255,255,255,.055);
  --glass-line:rgba(255,255,255,.13);
  --shadow:0 18px 50px -22px rgba(0,0,0,.7);
}
html{color-scheme:dark}
*{scrollbar-color:#5A5340 transparent}
.bg{background:
    radial-gradient(60% 50% at 12% 8%,rgba(212,175,55,.30),transparent 46%),
    radial-gradient(50% 45% at 92% 18%,rgba(130,130,135,.22),transparent 46%),
    radial-gradient(55% 50% at 80% 95%,rgba(212,175,55,.22),transparent 46%),
    var(--ivory)}
.spark{fill:#EBCB6B;opacity:.7}
.wordmark{background:linear-gradient(100deg,#FFFFFF 0%,#F0E3B0 55%,#D4AF37 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lang{background:rgba(255,255,255,.08);color:var(--ink)}
.lang:hover{background:rgba(255,255,255,.17)}
.hero h1 em{background:linear-gradient(100deg,#F7EFD0,#E3C14F 55%,#C0C0C4);-webkit-background-clip:text;background-clip:text;color:transparent}
.drop{background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(212,175,55,.14))}
.drop.over{border-color:var(--purple);background:rgba(212,175,55,.22)}
.btn{background:linear-gradient(120deg,#9C7A1A,#C9A227);box-shadow:0 10px 24px -10px rgba(212,175,55,.5)}
.btn:hover{box-shadow:0 14px 30px -10px rgba(230,194,70,.65)}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--purple-2);border:1px solid rgba(212,175,55,.38);box-shadow:none}
.btn.ghost:hover{background:rgba(255,255,255,.13)}
.chosen{background:rgba(255,255,255,.06)}
.error{background:rgba(233,120,165,.15);border:1px solid rgba(233,140,178,.5);color:#F8BBD4}
.steps li.active::before{box-shadow:0 0 0 5px rgba(212,175,55,.28)}
.chip,.stat,.prob,.frow{background:rgba(255,255,255,.06)}
.note{background:rgba(212,175,55,.2);color:var(--ink)}
.note.warn{background:rgba(233,166,200,.22)}
.hb-track{background:rgba(255,255,255,.1)}
.hb-track i.neg{background:linear-gradient(90deg,var(--pink),#CFCFD2)}
.okmsg{background:rgba(212,175,55,.16);border:1px solid var(--glass-line);color:var(--ink)}
.sev.high{background:rgba(233,120,165,.24);color:#FAC0D8}
.sev.medium{background:rgba(255,200,110,.2);color:#FFD890}
.sev.low{background:rgba(212,175,55,.25);color:var(--ink)}
.fsel,.finp{background:rgba(255,255,255,.07);color:var(--ink);border:1px solid rgba(212,175,55,.32)}
.fsel option{background:#1A1A1D;color:#F3F0E8}
.fsel:focus,.finp:focus{border-color:var(--purple)}
.finp::placeholder{color:var(--gray);opacity:.9}
.pill{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid rgba(212,175,55,.34)}
.pill.on{background:#9C7A1A;border-color:#E3C14F;color:#fff}
.fchips label{background:rgba(255,255,255,.06);color:var(--ink)}

/* ---------- الخطة التسويقية ---------- */
.mkt{display:none;max-width:1000px;margin:0 auto}
.mkt-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.mkt-title{margin:0 0 16px;color:var(--ink);font-size:clamp(26px,4vw,38px)}
.mctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;padding:18px;margin-bottom:18px;align-items:end}
.mnav{position:sticky;top:8px;z-index:5;display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;margin-bottom:18px;border-radius:18px}
.mpill{padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--glass-line);color:var(--ink);font-size:13px;font-weight:600}
.mpill:hover{background:rgba(255,255,255,.18)}
.msec{padding:24px;margin-bottom:18px;scroll-margin-top:90px}
.msec h2{margin:0 0 14px;color:var(--ink);font-size:21px}
.mquote{font-size:19px;color:var(--ink);line-height:1.6;margin:0 0 10px;font-weight:600}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.mcard{background:rgba(255,255,255,.06);border:1px solid var(--glass-line);border-radius:16px;padding:16px}
.mcard h3{margin:0 0 6px;font-size:16px;color:var(--ink)}
.mcard p{margin:6px 0}
.mev{font-size:13px;color:var(--gray);border-inline-start:3px solid var(--lilac);padding-inline-start:10px;margin-top:8px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;margin-bottom:6px}
.badge.high{background:rgba(94,201,140,.18);color:#8EE2B1}.badge.medium{background:rgba(240,190,80,.18);color:#F3CF85}.badge.low{background:rgba(255,255,255,.10);color:var(--gray)}
.mlist{margin:6px 0 0;padding-inline-start:20px}.mlist li{margin:3px 0}
.mbar{display:flex;height:16px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.12);margin:6px 0 10px}
.mbar i{display:block;height:100%}
.mlegend{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:13px;margin-bottom:14px}
.mlegend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-inline-end:6px}
.mtl{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.mscroll{overflow-x:auto}
.mtable{width:100%;border-collapse:collapse;font-size:14px}
.mtable th,.mtable td{padding:9px 10px;text-align:start;border-bottom:1px solid var(--lavender);vertical-align:top}
.mtable th{color:var(--ink)}
.slogan{display:inline-block;margin:4px;padding:6px 14px;border-radius:999px;background:var(--lilac);color:var(--ink);font-weight:600}
.mcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.mcta{margin-top:22px;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.mcta h3{margin:0 0 4px;color:var(--ink)}.mcta p{margin:0}
.mpulse{animation:mp 1.4s ease-in-out infinite}
@keyframes mp{50%{opacity:.55}}
.mnote{font-size:13px;color:var(--gray);text-align:center;margin:8px 0 0}
.sum-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.cstats{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font-size:13px;color:var(--gray)}
@media print{
  .bg,header.top,footer,#uploadView,#loadingView,#historyView,#welcomeView,.mnav,.mctl,.mkt-top{display:none!important}
  body:not(.print-results) #resultsView{display:none!important}
  body{background:#fff!important}.wrap{max-width:none;padding:0}
  .mkt{display:block!important;max-width:none}
  .glass,.mcard{background:#fff!important;box-shadow:none!important;backdrop-filter:none!important;border:1px solid #ccc!important}
  .msec{break-inside:avoid;margin-bottom:12px}
  .mkt h1,.mkt h2,.mkt h3,.mkt p,.mkt li,.mkt td,.mkt th,.mkt span,.mkt b,.mkt div{color:#1b1d33!important}
  .mkt .mev,.mkt .mnote{color:#555a78!important}
  .slogan{background:#ECE9F8!important}.mbar{background:#E7E9F2!important}
  .badge{background:#EEF0F7!important}.mtable th,.mtable td{border-bottom:1px solid #d9dbea!important}
}

/* ---------- قائمة الحفظ (PDF / Word) ---------- */
.dl{position:relative;display:inline-block}
.dl-menu{display:none;position:absolute;inset-inline-end:0;top:calc(100% + 8px);min-width:210px;padding:8px;z-index:30;border-radius:16px;
  background:#1A1A1D;border:1px solid var(--glass-line);box-shadow:var(--shadow)}
.dl-menu.open{display:grid;gap:4px}
.dl-item{display:flex;align-items:center;gap:10px;border:0;border-radius:12px;padding:10px 14px;background:transparent;color:var(--ink);font-weight:600;text-align:start}
.dl-item:hover{background:rgba(255,255,255,.1)}
.dl-item svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- طباعة صفحة التحليل (حفظ PDF من المتصفح بخط الموقع) ---------- */
@media print{
  body.print-results{background:#fff!important;
    --ink:#111111;--body:#2b2b2b;--gray:#555555;--purple:#111111;--purple-2:#333333;--lilac:#BDBDBD;
    --glass:#fff;--glass-line:#ccc;--shadow:none}
  body.print-results *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.print-results .wrap{max-width:none;padding:0}
  body.print-results .mkt{display:none!important}
  body.print-results #resultsView{display:block!important}
  body.print-results .glass{background:#fff!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border:1px solid #ccc!important}
  body.print-results .res-btns,body.print-results .fpanel,body.print-results .dbar,body.print-results .trow,
  body.print-results .mcta,body.print-results .fx,body.print-results .ctools,body.print-results .okmsg,
  body.print-results .btn,body.print-results .savestate{display:none!important}
  body.print-results .hb-track{background:#E6E6E6!important}
  body.print-results .hb-track i,body.print-results .vb-plot i{background:#333333!important}
  body.print-results .hb-track i.neg{background:#9A9A9A!important}
  body.print-results .donut-wrap circle:first-child{stroke:#E6E6E6!important}
  body.print-results .stat,body.print-results .chip,body.print-results .prob{background:#fff!important;border:1px solid #ccc!important}
  body.print-results .note{background:#EDEDED!important;color:#111111!important}
  body.print-results .note.warn{background:#DDDDDD!important}
  body.print-results .card,body.print-results .summary,body.print-results .stat,body.print-results .prob{break-inside:avoid}
}

/* ---------- شعار التقرير + قائمة الحفظ ---------- */
.dl-menu{min-width:260px}
.dl-sep{height:1px;margin:4px 6px;background:var(--glass-line)}
.dl-logo{display:grid;gap:6px;padding:2px 0 4px}
.dl-thumb{display:flex;align-items:center;gap:10px;padding:6px 10px;font-size:13px;color:var(--body)}
.dl-thumb img{max-height:34px;max-width:96px;padding:3px 6px;border-radius:8px;background:#fff;object-fit:contain}
.dl-thumb span{flex:1}
.dl-link{border:0;background:transparent;color:var(--purple-2);font-size:13px;font-weight:600;text-decoration:underline;padding:4px}
.dl-entity{padding:4px 10px 2px}
.dl-entity .flab{flex-direction:column;align-items:stretch;gap:4px;font-size:13px}
.dl-hint{padding:0 14px;font-size:12px;color:var(--gray);line-height:1.5}
.dl-err{margin:2px 10px 4px;padding:6px 10px;border-radius:10px;font-size:12.5px;background:rgba(233,120,165,.15);color:#F8BBD4}
.print-head,.ptable{display:none}

/* ---------- حجم الورقة وترقيم الصفحات ---------- */
@page{size:A4;margin:13mm 12mm 17mm;
  @bottom-center{content:"BEYOND  ·  " counter(page);font-family:Cairo,Inter,sans-serif;font-size:8pt;color:#666666}}

/* ---------- تنسيق تقرير الـ PDF (الخط، الجداول، الرسومات) ---------- */
@media print{
  body.print-results{font-family:Cairo,Inter,system-ui,sans-serif;font-size:10.5pt;line-height:1.75;color:#111111}
  body.print-results .res-head{display:none!important}
  /* الرأس: الشعار + العنوان */
  body.print-results .print-head{display:flex;align-items:center;gap:18px;padding:12px 18px;margin:0 0 16px;
    border:1px solid #BDBDBD;border-radius:12px;background:#F4F4F4!important;break-inside:avoid}
  body.print-results .ph-logo{flex:none;max-height:17mm;max-width:52mm;object-fit:contain}
  body.print-results .ph-text{flex:1;min-width:0}
  body.print-results .print-head.has-logo .ph-text{text-align:end}
  body.print-results .ph-title{font-size:19pt;font-weight:700;line-height:1.3;color:#111111}
  body.print-results .ph-for{font-size:12pt;font-weight:600;color:#111111;line-height:1.5}
  body.print-results .ph-meta{font-size:9.5pt;color:#555555}
  body.print-results .ph-brand{font-size:8pt;letter-spacing:.06em;color:#111111}
  /* العناوين */
  body.print-results .sec-title{margin:20px 0 10px;padding-bottom:6px;border-bottom:1.5px solid #BDBDBD;font-size:14pt;font-weight:700;color:#111111}
  body.print-results .summary h2,body.print-results .card h3{font-weight:700;color:#111111}
  body.print-results .summary h2{font-size:13pt}
  body.print-results .summary p{font-size:11pt;line-height:1.85}
  body.print-results .card h3{font-size:12pt}
  /* الأرقام */
  body.print-results .stats{grid-template-columns:repeat(4,1fr)!important;gap:8px}
  body.print-results .stat{padding:10px 12px;background:#F4F4F4!important}
  body.print-results .stat small{font-size:8.5pt}
  body.print-results .stat b{font-size:17pt;font-weight:600}
  /* المخططات: عمود واحد، كل بطاقة ما تنكسر بين صفحتين */
  body.print-results .charts,body.print-results .two{grid-template-columns:1fr!important;gap:10px}
  body.print-results .charts .card:last-child:nth-child(odd){grid-column:auto}
  body.print-results .card{padding:14px 16px;break-inside:avoid}
  body.print-results .card[data-pt="bars"] .hbars{display:none}
  body.print-results .card[data-pt="pie"] .legend{display:none}
  body.print-results .card[data-pt="pie"] .donut-wrap{justify-content:center}
  body.print-results .donut-wrap svg{width:150px;height:150px}
  body.print-results .vbars{height:170px}
  body.print-results .cstats{font-size:9pt;margin-top:10px}
  /* الجداول */
  body.print-results .ptable{display:table;width:100%;margin-top:10px;border-collapse:collapse;font-size:9.5pt;line-height:1.5}
  body.print-results .ptable thead{display:table-header-group}
  body.print-results .ptable tr{break-inside:avoid}
  body.print-results .ptable th{padding:5px 8px;background:#EDEDED!important;color:#111111;font-weight:700;text-align:start;border-bottom:1.5px solid #333333}
  body.print-results .ptable td{padding:4px 8px;color:#111111;border-bottom:.5pt solid #E6E6E6;vertical-align:middle}
  body.print-results .ptable tbody tr:nth-child(even) td{background:#F7F7F7!important}
  body.print-results .ptable tbody tr:last-child td{border-bottom:1px solid #BDBDBD}
  body.print-results .ptable .num{direction:ltr;text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums}
  body.print-results .ptable .b{font-weight:600}
  body.print-results .ptable .ltr{direction:ltr;text-align:start}
  body.print-results .ptable .lab{width:32%}
  body.print-results .ptable .bar{width:36%}
  body.print-results .ptable .sw{width:22px;text-align:center}
  body.print-results .ptable .up{color:#111111}
  body.print-results .ptable .down{color:#111111}
  body.print-results .psw{display:inline-block;width:10px;height:10px;border-radius:50%}
  body.print-results .pbar{height:8px;border-radius:99px;background:#E6E6E6!important;overflow:hidden}
  body.print-results .pbar i{display:block;height:100%;border-radius:99px;background:#333333!important}
  body.print-results .pbar i.neg{background:#9A9A9A!important}
  /* القوائم والمشاكل (الألوان الفاتحة مال الثيم الغامق ما تنقرأ على ورق أبيض) */
  body.print-results .list li{margin-bottom:2px}
  body.print-results .sev.high{background:#111111!important;color:#FFFFFF!important}
  body.print-results .sev.medium{background:#666666!important;color:#FFFFFF!important}
  body.print-results .sev.low{background:#E6E6E6!important;color:#111111!important}
  body.print-results .prob{break-inside:avoid}
}

@media print{
  body.print-results .list svg[fill="#D4AF37"]{fill:#111111!important}
  body.print-results .list svg[stroke="#D4AF37"]{stroke:#111111!important}
  body.print-results .donut-wrap svg circle:nth-child(1){stroke:#F0F0F0!important}
  body.print-results .donut-wrap svg circle:nth-child(2){stroke:#111111!important}
  body.print-results .donut-wrap svg circle:nth-child(3){stroke:#4A4A4A!important}

  body.print-results .donut-wrap svg circle:nth-child(5){stroke:#A3A3A3!important}
  body.print-results .donut-wrap svg circle:nth-child(6){stroke:#C2C2C2!important}
  body.print-results .donut-wrap svg circle:nth-child(7){stroke:#DADADA!important}
}

/* مراحل التحميل شكلية (الـ backend يرد مره وحده بالنهايه) */
function buildSteps(active = 0) {
  const ul = $("steps");
  ul.innerHTML = "";
  t("steps").forEach((label, i) => {
    const li = document.createElement("li");
    li.textContent = label;
    li.className = i < active ? "done" : i === active ? "active" : "";
    ul.appendChild(li);
  });
}
function startSteps() {
  let i = 0;
  buildSteps(0);
  stepTimer = setInterval(() => {
    i = Math.min(i + 1, t("steps").length - 1);
    buildSteps(i);
  }, 3500);
}
function stopSteps() { clearInterval(stepTimer); }
/* ---------- الاتصال بالـ backend ---------- */
async function analyze() {
  if (!chosenFile) return;
  showError("");
  show("loading");
  startSteps();
  const body = new FormData();
  body.append("file", chosenFile);
  try {
    const res = await fetch(API_BASE + "/upload", { method: "POST", body, headers: { "X-Owner": getOwner() } });
    let data = null;
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) {
      throw new Error(data && typeof data.detail === "string" ? data.detail : t("errGeneric"));
    }
    lastData = data;
    baseData = JSON.parse(JSON.stringify(data));
    resetFilter();
    lastSaved = savePayload(data);
    setHash(data.saved ? data.upload_id : null);
    renderResults(data);
    show("results");
  } catch (err) {
    showError(err instanceof TypeError ? t("errNet") : err.message);
    show("upload");
  } finally {
    stopSteps();
  }
}

/* نصغّر الشعار (حد أقصى 600×300) ونحوّله PNG: يخفف حجم التقرير ويضمن يشتغل بكل البرامج */
function readLogo(file) {
  return new Promise((resolve, reject) => {
    if (!/^image\/(png|jpe?g|webp|svg\+xml)$/.test(file.type)) return reject(new Error(t("logoErrType")));
    if (file.size > 3 * 1048576) return reject(new Error(t("logoErrSize")));
    const fr = new FileReader();
    fr.onerror = () => reject(new Error(t("errGeneric")));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error(t("logoErrType")));
      img.onload = () => {
        try {
          const vec = file.type === "image/svg+xml";
          const w0 = img.naturalWidth || 300, h0 = img.naturalHeight || 150;
          const k = Math.min(vec ? Infinity : 1, 600 / w0, 300 / h0);
          const w = Math.max(1, Math.round(w0 * k)), h = Math.max(1, Math.round(h0 * k));
          const cv = document.createElement("canvas");
          cv.width = w; cv.height = h;
          cv.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve({ url: cv.toDataURL("image/png"), w, h });
        } catch (e) { reject(new Error(t("errGeneric"))); }
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- صفوف المخطط (مشتركة بين جدول الـ PDF وجدول الـ Word) ---------- */
function chartRows(a) {
  const labels = (a.labels || []).map(String), values = (a.values || []).map(Number);
  const isTime = labels.length > 1 && labels.every((l) => /^\d{4}-\d{2}(-\d{2})?$/.test(l));
  const pos = values.map((v) => Math.max(v, 0)), sum = pos.reduce((x, y) => x + y, 0);
  const allPos = values.every((v) => v >= 0);
  let denom = null;                                   // النسبة تُحسب من المجموع الحقيقي (كل المجموعات) إذا موجود
  if (a.chart === "pie" && sum > 0) denom = sum;
  else if (!isTime && allPos && a.stats && a.stats.total > 0) denom = a.stats.total;
  const rows = labels.map((label, i) => ({
    label, value: values[i],
    share: denom ? (values[i] / denom) * 100 : null,
    change: isTime && i > 0 && values[i - 1] ? ((values[i] - values[i - 1]) / Math.abs(values[i - 1])) * 100 : null
  }));
  return { labels, values, isTime, rows };
}
const REPORT_PIE = ["#111111", "#4A4A4A", "#7A7A7A", "#A3A3A3", "#C2C2C2", "#DADADA"];   // ألوان الدائري بالتقرير: أسود ← رمادي فاتح
/* مخطط دائري كامل كصورة PNG (Word ما يرسم مخططات من HTML) */
function drawPiePng(rows) {
  const S = 640, cv = document.createElement("canvas");
  cv.width = cv.height = S;
  const g = cv.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, S, S);
  const vals = rows.map((r) => Math.max(r.value, 0)), total = vals.reduce((x, y) => x + y, 0) || 1;
  const cx = S / 2, cy = S / 2, R = S / 2 - 14;
  let ang = -Math.PI / 2;
  vals.forEach((v, i) => {
    if (v <= 0) return;
    const sweep = (v / total) * 2 * Math.PI;
    g.beginPath(); g.moveTo(cx, cy); g.arc(cx, cy, R, ang, ang + sweep); g.closePath();
    g.fillStyle = REPORT_PIE[i % REPORT_PIE.length]; g.fill();
    g.lineWidth = 5; g.strokeStyle = "#fff"; g.stroke();
    const pct = (v / total) * 100;
    if (pct >= 5) {
      const m = ang + sweep / 2;
      g.fillStyle = i < 3 ? "#fff" : "#111";
      g.font = "bold 40px 'Segoe UI',Arial,sans-serif";
      g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText(pct.toFixed(1) + "%", cx + Math.cos(m) * R * 0.64, cy + Math.sin(m) * R * 0.64);
    }
    ang += sweep;
  });
  return cv.toDataURL("image/png");
}
const fmtPct = (x) => x.toFixed(1) + "%";
const fmtChg = (x) => (x > 0 ? "+" : "") + x.toFixed(1) + "%";

/* ---------- حفظ كملف Word من الصفحة نفسها (بدون السيرفر) ---------- */
function buildWordHtml(d, logo, pies, appLogo) {
  const ar = lang === "ar", dir = ar ? "rtl" : "ltr", al = ar ? "right" : "left", oppo = ar ? "left" : "right";
  const INK = "#111111", GRAY = "#555555", BORDER = "#CFCFCF", PURPLE = "#111111", BAR = "#333333", NEG = "#9A9A9A",
    TRACK = "#E6E6E6", HEAD = "#EDEDED", ZEBRA = "#F7F7F7", CARDBG = "#F4F4F4", LILAC = "#BDBDBD";
  const PIE = REPORT_PIE;
  const FONT = "Cairo,'Segoe UI',Tahoma,Arial,sans-serif";
  const esc = (v) => String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const gap = '<p style="margin:0;font-size:6pt">&nbsp;</p>';
  const ltr = (v) => `<span dir="ltr">${esc(v)}</span>`;

  const card = (title, inner, size = 14) =>
    `<table width="100%" dir="${dir}" cellpadding="0" cellspacing="0" style="border:.75pt solid ${BORDER};border-collapse:collapse"><tr><td style="padding:10pt 12pt;text-align:${al}">` +
    `<p style="margin:0 0 8pt;font-size:${size}pt;font-weight:bold;color:${INK};border-bottom:1pt solid ${LILAC};padding-bottom:4pt">` +
    `<span style="color:${PURPLE};font-size:${Math.round(size * 0.6)}pt">&#9632;</span>&nbsp; ${esc(title)}</p>${inner}</td></tr></table>${gap}`;
  const bullet = (txt) => `<p style="margin:0 0 5pt;font-size:11pt;line-height:150%"><span style="color:${PURPLE};font-size:8pt">&#9679;</span>&nbsp; ${esc(txt)}</p>`;
  const chip = (txt, bg) => `<span style="background:${bg};font-size:9pt;color:${INK}">&nbsp;${esc(txt)}&nbsp;</span>&nbsp; `;
  const split = (pct, color) => {                       // شريط من خليتين: الممتلئ + الفاضي (الاتجاه يتبع dir)
    const p = Math.max(0, Math.min(100, pct));
    const cell = (w, c) => `<td width="${w}%" bgcolor="${c}" style="font-size:2pt;line-height:6pt;height:8px">&nbsp;</td>`;
    return `<table width="100%" dir="${dir}" cellspacing="0" cellpadding="0"><tr>${p > 0 ? cell(p, color) : ""}${p < 100 ? cell(100 - p, TRACK) : ""}</tr></table>`;
  };

  /* جدول بيانات: رأس ملوّن + صفوف مخططة (zebra) + خطوط رفيعة */
  const hc = (txt, w, a) =>
    `<td ${w ? `width="${w}"` : ""} bgcolor="${HEAD}" style="padding:4pt 6pt;border-bottom:1.5pt solid ${BAR};text-align:${a}">` +
    `<p style="margin:0;font-size:9.5pt;font-weight:bold;color:${INK}">${esc(txt)}</p></td>`;
  const tc = (inner, i, a, w, bold) =>
    `<td ${w ? `width="${w}"` : ""} ${i % 2 ? `bgcolor="${ZEBRA}"` : ""} style="padding:3pt 6pt;border-bottom:.5pt solid ${TRACK};text-align:${a}">` +
    `<p style="margin:0;font-size:10pt;${bold ? "font-weight:bold;" : ""}color:${INK}">${inner}</p></td>`;
  const table = (head, rows) =>
    `<table width="100%" dir="${dir}" cellspacing="0" cellpadding="0" style="border-collapse:collapse"><tr>${head}</tr>${rows}</table>`;

  const chartHtml = (a, idx) => {
    const c = chartRows(a);
    if (!c.rows.length) return "";
    const hasShare = c.rows.some((r) => r.share != null);
    const mx = Math.max(...c.values.map(Math.abs), 1);

    if (a.chart === "pie") {
      const pos = c.values.map((v) => Math.max(v, 0)), total = pos.reduce((x, y) => x + y, 0) || 1;
      let stack = `<table width="100%" dir="${dir}" cellspacing="0" cellpadding="0"><tr>`;
      pos.forEach((v, i) => { if (v > 0) stack += `<td width="${((v / total) * 100).toFixed(2)}%" bgcolor="${PIE[i % PIE.length]}" style="font-size:2pt;line-height:12pt;height:16px">&nbsp;</td>`; });
      stack += "</tr></table>" + gap;
      const pi = pies && pies[idx];
      if (pi) stack = `<p style="margin:0;text-align:center"><img src="${pi.src}" width="${pi.w}" height="${pi.h}" alt=""></p>` + gap;
      const head = hc("", "5%", "center") + hc(t("colItem"), "", al) + hc(t("colValue"), "20%", "right") + hc(t("colShare"), "16%", "right");
      const rows = c.rows.map((r, i) =>
        "<tr>" + tc(`<span style="color:${PIE[i % PIE.length]};font-size:12pt">&#9632;</span>`, i, "center", "5%") + tc(esc(r.label), i, al) +
        tc(ltr(fmt(r.value)), i, "right", "20%", true) + tc(r.share != null ? ltr(fmtPct(r.share)) : "", i, "right", "16%") + "</tr>").join("");
      return stack + table(head, rows);
    }

    if (c.isTime) {
      const H = 130, step = c.labels.length > 12 ? 2 : 1, w = (100 / c.labels.length).toFixed(2);
      let r1 = "", r2 = "";
      c.values.forEach((v, i) => {
        const h = Math.max(Math.round((Math.abs(v) / mx) * H), 2);
        const p = c.labels[i].split("-");
        const short = p.length === 3 ? p[2] + "/" + p[1] : p[1] + "/" + p[0].slice(2);
        r1 += `<td width="${w}%" valign="bottom" align="center" height="${H + 14}"><p style="margin:0;font-size:7pt;color:${GRAY}">${c.labels.length <= 8 ? esc(fmt(v)) : "&nbsp;"}</p>` +
              `<table width="70%" align="center" cellspacing="0" cellpadding="0" height="${h}"><tr><td bgcolor="${v < 0 ? NEG : BAR}" style="font-size:1pt;line-height:1pt">&nbsp;</td></tr></table></td>`;
        r2 += `<td align="center" style="font-size:7pt;color:${GRAY}">${i % step === 0 ? esc(short) : "&nbsp;"}</td>`;
      });
      const chart = `<table width="100%" dir="ltr" cellspacing="2" cellpadding="0"><tr>${r1}</tr><tr>${r2}</tr></table>` + gap;
      const head = hc(t("colPeriod"), "", al) + hc(t("colValue"), "30%", "right") + hc(t("colChange"), "25%", "right");
      const rows = c.rows.map((r, i) =>
        "<tr>" + tc(ltr(r.label), i, al) + tc(ltr(fmt(r.value)), i, "right", "30%", true) +
        tc(r.change != null ? `<span dir="ltr">${esc(fmtChg(r.change))}</span>` : "", i, "right", "25%") + "</tr>").join("");
      return chart + table(head, rows);
    }

    const head = hc(t("colItem"), "30%", al) + hc("", "36%", al) + hc(t("colValue"), "18%", "right") + (hasShare ? hc(t("colShare"), "16%", "right") : "");
    const rows = c.rows.map((r, i) =>
      "<tr>" + tc(esc(r.label), i, al, "30%") +
      `<td width="36%" ${i % 2 ? `bgcolor="${ZEBRA}"` : ""} style="padding:3pt 6pt;border-bottom:.5pt solid ${TRACK}">${split((Math.abs(r.value) / mx) * 100, r.value < 0 ? NEG : BAR)}</td>` +
      tc(ltr(fmt(r.value)), i, "right", "18%", true) + (hasShare ? tc(r.share != null ? ltr(fmtPct(r.share)) : "", i, "right", "16%") : "") + "</tr>").join("");
    return table(head, rows);
  };

  const rep = d.cleaning_report || {};
  const date = new Date().toLocaleString(ar ? "ar-IQ" : "en-US", { dateStyle: "medium", timeStyle: "short" });

  /* رأس التقرير: الشعار (إذا موجود) + العنوان، وخط ملوّن تحتهم */
  let body =
    `<table width="100%" dir="${dir}" cellspacing="0" cellpadding="0" style="border-collapse:collapse"><tr>` +
    (logo ? `<td width="34%" valign="middle" style="padding:0 0 8pt;text-align:${al}"><img src="${logo.src}" width="${logo.w}" height="${logo.h}" alt=""></td>` : "") +
    `<td valign="middle" style="padding:0 0 8pt;text-align:${logo ? oppo : al}">` +
    `<p style="margin:0;font-size:22pt;font-weight:bold;color:${INK}">${esc(t("reportTitle"))}</p>` +
    (reportEntity.trim() ? `<p style="margin:3pt 0 0;font-size:12.5pt;font-weight:bold;color:#333333">${esc(t("reportFor") + ": " + reportEntity.trim())}</p>` : "") +
    `<p style="margin:2pt 0 0;font-size:10pt;color:${GRAY}">${esc(date)}${d.business_type ? esc("  ·  " + t("business") + ": " + d.business_type) : ""}</p>` +
    `<p style="margin:2pt 0 0;font-size:9pt;color:${PURPLE}">${appLogo ? `<img src="${appLogo.src}" width="${appLogo.w}" height="${appLogo.h}" alt="">&nbsp; ` : ""}<span dir="ltr">Beyond &mdash; Beyond the Visible.</span></p></td></tr>` +
    `</table>${gap}${gap}`;

  if (d.summary) body += card(t("summary"), `<p style="margin:0;font-size:11.5pt;line-height:160%">${esc(d.summary)}</p>`);

  const stats = [[t("rowsAnalyzed"), rep.rows_after, rep.rows_before], [t("dups"), rep.duplicates_removed], [t("missing"), rep.dropped_rows_missing], [t("cols"), rep.columns_after, rep.columns_before]];
  body += `<table width="100%" dir="${dir}" cellspacing="6" cellpadding="0"><tr>` +
    stats.map(([l, v, of]) => `<td width="25%" bgcolor="${CARDBG}" style="padding:8pt 10pt;border:.75pt solid ${BORDER};text-align:${al}"><p style="margin:0;font-size:9pt;color:${GRAY}">${esc(l)}</p>` +
      `<p style="margin:0;font-size:18pt;font-weight:bold;color:${INK}">${esc(fmt(v || 0))}</p><p style="margin:0;font-size:9pt;color:${GRAY}">${of != null ? esc(t("of") + " " + fmt(of)) : "&nbsp;"}</p></td>`).join("") + `</tr></table>${gap}`;

  let notes = "";
  const fi = d.filter_info;
  if (fi) {
    notes += chip(`${t("rowsAfterFilter")}: ${fmt(fi.rows_after)} ${t("of")} ${fmt(fi.rows_before)}`, HEAD);
    (fi.descriptions || []).forEach((x) => (notes += chip(x, HEAD)));
  }
  Object.entries(rep.filled_columns || {}).forEach(([c, how]) => (notes += chip(`${t("filled")}: ${c} (${t(how) || how})`, HEAD)));
  (rep.dropped_columns || []).forEach((c) => (notes += chip(`${t("dropped")}: ${c}`, "#DDDDDD")));
  if (notes) body += `<p style="margin:0 0 10pt;line-height:175%">${notes}</p>`;

  const analyses = d.analyses || [];
  if (analyses.length) {
    body += `<p style="margin:8pt 0 8pt;font-size:16pt;font-weight:bold;color:${INK}">${esc(t("charts"))}</p>`;
    analyses.forEach((a, i) => (body += card(a.title || "-", chartHtml(a, i), 13)));
  }
  if ((d.insights || []).length) body += card(t("insights"), d.insights.map(bullet).join(""));
  if ((d.recommendations || []).length) body += card(t("recs"), d.recommendations.map(bullet).join(""));
  if ((d.problems || []).length) {
    const sevL = { high: t("sevHigh"), medium: t("sevMed"), low: t("sevLow") };
    const sevC = { high: ["#111111", "#FFFFFF"], medium: ["#666666", "#FFFFFF"], low: [HEAD, INK] };
    body += card(t("problemsTitle"), d.problems.map((p) => {
      const c = sevC[p.severity] || sevC.low;
      return `<p style="margin:0 0 2pt;font-size:11.5pt;font-weight:bold"><span style="background:${c[0]};color:${c[1]};font-size:9pt">&nbsp;${esc(sevL[p.severity] || "")}&nbsp;</span>&nbsp; ${esc(p.title)}</p>` +
        `<p style="margin:0 0 2pt;font-size:11pt">${esc(p.detail)}</p>` +
        (p.fix ? `<p style="margin:0 0 8pt;font-size:11pt;color:${GRAY}">${esc(t("fix"))}: ${esc(p.fix)}</p>` : "");
    }).join(""));
  }

  const pageField =
    `<!--[if supportFields]><span style="mso-element:field-begin"></span><span style="mso-spacerun:yes"> </span>PAGE <span style="mso-element:field-separator"></span><![endif]-->` +
    `<span>1</span><!--[if supportFields]><span style="mso-element:field-end"></span><![endif]-->`;
  const css =
    `@page Section1{size:21cm 29.7cm;margin:1.8cm 1.8cm 2cm 1.8cm;mso-footer:f1;mso-footer-margin:1cm}` +
    `div.Section1{page:Section1}` +
    `body{font-family:${FONT};mso-bidi-font-family:${FONT};font-size:11pt;color:${INK}}` +
    `p,td,th,span,li{font-family:${FONT};mso-bidi-font-family:${FONT};mso-ascii-font-family:Cairo;mso-hansi-font-family:Cairo}` +
    `table{mso-table-lspace:0;mso-table-rspace:0}tr{page-break-inside:avoid}`;
  return `<html lang="${lang}" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>Beyond</title>` +
    `<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]-->` +
    `<style>${css}</style></head>` +
    `<body dir="${dir}" style="direction:${dir};text-align:${al}"><div class="Section1">${body}</div>` +
    `<div style="mso-element:footer" id="f1"><p style="margin:0;text-align:center;font-size:8pt;color:${GRAY}">BEYOND &nbsp;&middot;&nbsp; ${pageField}</p></div>` +
    `</body></html>`;
}

/* Word ما يقرأ الصور المدمجة data: من HTML، فنغلّف الملف بصيغة MHTML (HTML + الصورة) وWord يفتحها عادي بامتداد .doc */
function b64Utf8(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
const wrap76 = (s) => s.replace(/.{1,76}/g, "$&\r\n");
function buildWordMht(html, assets) {
  const B = "----=_NextPart_datova_" + Date.now().toString(16);
  const lines = [
    "MIME-Version: 1.0",
    `Content-Type: multipart/related; boundary="${B}"; type="text/html"`,
    "",
    `--${B}`,
    'Content-Type: text/html; charset="utf-8"',
    "Content-Transfer-Encoding: base64",
    "Content-Location: file:///C:/datova/report.htm",
    "",
    wrap76(b64Utf8(html))
  ];
  assets.forEach((x) => lines.push(
    `--${B}`, "Content-Type: image/png", "Content-Transfer-Encoding: base64",
    `Content-Location: file:///C:/datova/${x.loc}`, "", wrap76(x.url.split(",")[1])
  ));
  lines.push(`--${B}--`, "");
  return lines.join("\r\n");
}
function exportWord() {
  if (!lastData) return;
  const assets = [];                                   // صور تنحط داخل الملف: الشعار + المخططات الدائرية
  let logo = null;
  if (reportLogo) {
    const s = Math.min(56 / reportLogo.h, 170 / reportLogo.w);        // حجم الشعار بالتقرير: ارتفاع أقصى 56px وعرض أقصى 170px
    logo = { src: "file:///C:/datova/logo.png", w: Math.round(reportLogo.w * s), h: Math.round(reportLogo.h * s) };
    assets.push({ loc: "logo.png", url: reportLogo.url });
  }
  const pies = (lastData.analyses || []).map((a, i) => {
    if (a.chart !== "pie") return null;
    const rows = chartRows(a).rows;
    if (!rows.length) return null;

      assets.push({ loc: `pie${i}.png`, url: drawPiePng(rows) });

  });
  assets.push({ loc: "beyond.png", url: LOGO_SRC });
  const html = buildWordHtml(lastData, logo, pies, { src: "file:///C:/datova/beyond.png", w: 14, h: 17 });
  const blob = assets.length
    ? new Blob([buildWordMht(html, assets)], { type: "application/msword" })
    : new Blob(["\ufeff" + html], { type: "application/msword;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "datova-report.doc";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ---------- حفظ PDF (طباعة المتصفح بخط الموقع) ---------- */
function buildPrintTable(a) {
  const c = chartRows(a);
  if (!c.rows.length) return null;
  const kind = a.chart === "pie" ? "pie" : c.isTime ? "time" : "bars";
  const hasShare = c.rows.some((r) => r.share != null);
  const mx = Math.max(...c.values.map(Math.abs), 1);
  const cell = (tag, content, cls) => {
    const n = el(tag, cls || "");
    if (content instanceof Node) n.appendChild(content); else n.textContent = content;
    return n;
  };
  const heads = kind === "pie" ? [["", "sw"], [t("colItem"), ""], [t("colValue"), "num"], [t("colShare"), "num"]]
    : kind === "time" ? [[t("colPeriod"), ""], [t("colValue"), "num"], [t("colChange"), "num"]]
    : [[t("colItem"), "lab"], ["", "bar"], [t("colValue"), "num"], ...(hasShare ? [[t("colShare"), "num"]] : [])];
  const tb = el("table", "ptable");
  const hr = el("tr");
  heads.forEach(([txt, cls]) => hr.appendChild(cell("th", txt, cls)));
  tb.appendChild(el("thead")).appendChild(hr);
  const tbody = el("tbody");
  c.rows.forEach((r, i) => {
    const tr = el("tr");
    if (kind === "pie") {
      const sw = el("i", "psw"); sw.style.background = REPORT_PIE[i % REPORT_PIE.length];
      tr.append(cell("td", sw, "sw"), cell("td", r.label), cell("td", fmt(r.value), "num b"), cell("td", r.share != null ? fmtPct(r.share) : "", "num"));
    } else if (kind === "time") {
      const ch = r.change != null ? fmtChg(r.change) : "";
      tr.append(cell("td", r.label, "ltr"), cell("td", fmt(r.value), "num b"), cell("td", ch, "num " + (r.change == null ? "" : r.change >= 0 ? "up" : "down")));
    } else {
      const track = el("div", "pbar"), fill = el("i", r.value < 0 ? "neg" : "");
      fill.style.width = (Math.abs(r.value) / mx) * 100 + "%";
      track.appendChild(fill);
      tr.append(cell("td", r.label, "lab"), cell("td", track, "bar"), cell("td", fmt(r.value), "num b"));
      if (hasShare) tr.appendChild(cell("td", r.share != null ? fmtPct(r.share) : "", "num"));
    }
    tbody.appendChild(tr);
  });
  tb.appendChild(tbody);
  return { table: tb, kind };
}
function buildPrintHead(d) {
  const h = el("div", "print-head" + (reportLogo ? " has-logo" : ""));
  if (reportLogo) {
    const im = el("img", "ph-logo");
    im.src = reportLogo.url;
    im.alt = "";
    h.appendChild(im);
  }
  const tx = el("div", "ph-text");
  const date = new Date().toLocaleString(lang === "ar" ? "ar-IQ" : "en-US", { dateStyle: "medium", timeStyle: "short" });
  const meta = [date, d.business_type ? `${t("business")}: ${d.business_type}` : ""].filter(Boolean).join("  ·  ");
  const brand = el("div", "ph-brand");
  const bl = el("img", "ph-bl");
  bl.src = LOGO_SRC; bl.alt = ""; bl.style.cssText = "height:14px;width:auto;vertical-align:middle;margin-inline-end:6px";
  brand.appendChild(bl);
  const sp = el("span", "", "Beyond — Beyond the Visible.");
  sp.dir = "ltr";
  brand.appendChild(sp);
  tx.appendChild(el("div", "ph-title", t("reportTitle")));
  if (reportEntity.trim()) tx.appendChild(el("div", "ph-for", `${t("reportFor")}: ${reportEntity.trim()}`));
  tx.append(el("div", "ph-meta", meta), brand);
  h.appendChild(tx);
  return h;
}
async function printResults() {
  const root = $("resultsView");
  const added = [], cards = [];
  const head = buildPrintHead(lastData);
  root.prepend(head);
  added.push(head);
  root.querySelectorAll(".charts .card").forEach((card, i) => {
    const a = (lastData.analyses || [])[i];
    const pt = a && buildPrintTable(a);
    if (!pt) return;
    card.appendChild(pt.table);
    card.dataset.pt = pt.kind;
    added.push(pt.table);
    cards.push(card);
  });
  document.body.classList.add("print-results");
  const done = () => {
    document.body.classList.remove("print-results");
    added.forEach((n) => n.remove());
    cards.forEach((c) => delete c.dataset.pt);
    window.removeEventListener("afterprint", done);
  };
  window.addEventListener("afterprint", done);
  try {                                            // ننتظر الخطوط والشعار حتى يطلعون بالـ PDF
    const wait = [];
    if (document.fonts && document.fonts.ready) wait.push(document.fonts.ready);
    const logoImg = head.querySelector(".ph-logo");
    if (logoImg && logoImg.decode) wait.push(logoImg.decode());
    await Promise.all(wait);
  } catch (e) {}
  window.print();
}

async function refreshInsights(btn) {
  const d = lastData;
  if (!d || !d.upload_id || !d.filter_meta || insBusy) return;
  insBusy = true;
  if (btn) { btn.disabled = true; btn.textContent = t("refreshingInsights"); }
  const sig = JSON.stringify(currentSpecs(d));
  let again = false;
  try {
    const data = await api("/filter", { upload_id: d.upload_id, ...filterPayload(d.filter_meta), specs: currentSpecs(d), refresh_insights: true, lang });
    if (data.insights_error) throw new Error("ai");
    again = JSON.stringify(currentSpecs(lastData)) !== sig;                  // المستخدم عدّل المخططات أثناء التحديث
    lastData = { ...lastData, summary: data.summary, insights: data.insights, recommendations: data.recommendations, dismissed: [], problems: undefined, insights_stale: again };
  } catch (e) {
    lastData = { ...lastData, insights_stale: true };
  } finally {
    insBusy = false;
  }
  renderResults(lastData);
  if (again) scheduleInsightsRefresh();
}

const visibleCols = (meta, kinds) => meta.columns.filter((c) => kinds.includes(c.kind) && !fState.hidden.includes(c.name));
const labeledSel = (text, options, value, onChange) => labeled(text, fSelect(options, value, onChange));
function blankSpec(meta) {
  const g = visibleCols(meta, ["category", "numeric"])[0];
  return { kind: "group_agg", group_by: g ? g.name : "", value: "", agg: "count", top_n: 10, chart: "bar", title: "" };
}
function normalizeSpec(s) {
  return {
    kind: s.kind, group_by: s.group_by, value: s.value || null, agg: s.value ? s.agg : "count",
    top_n: Math.max(1, Math.min(30, Number(s.top_n) || 10)), chart: s.kind === "monthly_trend" ? "bar" : s.chart, title: (s.title || "").trim()
  };
}
function chartForm(d) {
  const meta = d.filter_meta, f = dState.form, s = f.spec;
  const box = el("div", "dform glass");
  const rebuild = () => box.replaceWith(chartForm(d));
  const dates = visibleCols(meta, ["date"]);
  const isTrend = s.kind === "monthly_trend";
  const grid = el("div", "dgrid");
  const kinds = [["group_agg", t("kindGroup")]];
  if (dates.length) kinds.push(["monthly_trend", t("kindTrend")]);
  grid.appendChild(labeledSel(t("fieldKind"), kinds, s.kind, (v) => {
    s.kind = v;
    s.group_by = ((v === "monthly_trend" ? dates : visibleCols(meta, ["category", "numeric"]))[0] || {}).name || "";
    rebuild();
  }));
  const gOpts = (isTrend ? dates : visibleCols(meta, ["category", "numeric"])).map((c) => [c.name, c.name]);
  grid.appendChild(labeledSel(isTrend ? t("fieldDate") : t("fieldGroup"), gOpts, s.group_by, (v) => (s.group_by = v)));
  grid.appendChild(labeledSel(t("fieldValue"), [["", t("countRows")], ...visibleCols(meta, ["numeric"]).map((c) => [c.name, c.name])], s.value || "", (v) => {
    s.value = v;
    s.agg = v ? (s.agg === "count" ? "sum" : s.agg) : "count";
    rebuild();
  }));
  if (s.value) {
    grid.appendChild(labeledSel(t("fieldAgg"), [["sum", t("aggSum")], ["mean", t("aggMean")], ["median", t("aggMedian")], ["max", t("aggMax")], ["min", t("aggMin")]], s.agg, (v) => (s.agg = v)));
  }
  if (!isTrend) {
    grid.appendChild(labeledSel(t("fieldChart"), [["bar", t("chartBar")], ["pie", t("chartPie")]], s.chart, (v) => (s.chart = v)));
    grid.appendChild(labeled(t("fieldTop"), fInput("number", String(s.top_n), "", (v) => (s.top_n = v), { min: "1", max: "30" })));
  }
  grid.appendChild(labeled(t("fieldTitle"), fInput("text", s.title || "", "", (v) => (s.title = v))));
  const ok = el("button", "btn", f.mode === "edit" ? t("formSave") : t("formAdd"));
  ok.type = "button";
  ok.addEventListener("click", () => guarded(ok, async () => {
    if (!s.group_by) throw new Error(t("errGeneric"));
    const specs = (d.analyses || []).map((a) => a.spec);
    if (f.mode === "edit") specs[f.index] = normalizeSpec(s); else specs.push(normalizeSpec(s));
    dState.form = null;
    await refreshDashboard(d, specs.filter(Boolean));
  }));
  const cancel = el("button", "btn ghost", t("cancel"));
  cancel.type = "button";
  cancel.addEventListener("click", () => { dState.form = null; renderResults(d); });
  const acts = el("div", "factions");
  acts.append(ok, cancel);
  box.append(grid, acts);
  return box;
}

/* ---------- حفظ التحليلات (تحليلاتي) ---------- */
let saveTimer = null, lastSaved = "", saveBox = null, histItems = null;
function setHash(id) {
  try { history.replaceState(null, "", id ? "#a=" + id : location.pathname + location.search); } catch (e) {}
}
function stateForSave(d) {
  const skip = ["filter_meta", "upload_id", "saved", "title", "message", "stored_filename", "file_size", "business_type", "original_filename", "cleaning_report"];
  const s = {};
  Object.keys(d).forEach((k) => { if (!skip.includes(k) && d[k] !== undefined) s[k] = d[k]; });
  s.ui = { rows: fState.rows, hidden: fState.hidden, gran: fState.gran, dateCol: fState.dateCol };
  return s;
}
const savePayload = (d) => JSON.stringify({ title: d.title || "", state: stateForSave(d) });
const setSaveText = (txt) => { if (saveBox && saveBox.isConnected) saveBox.textContent = txt; };
function scheduleSave() {
  if (!lastData || !lastData.saved || !lastData.upload_id) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 700);
}
async function saveNow() {
  const d = lastData;
  if (!d || !d.saved) return;
  const payload = savePayload(d);
  if (payload === lastSaved) return;
  setSaveText(t("saving"));
  try {
    const res = await fetch(API_BASE + "/analysis/" + d.upload_id, {
      method: "PUT", headers: { "Content-Type": "application/json", "X-Owner": getOwner() }, body: payload
    });
    if (!res.ok) throw new Error("save");
    lastSaved = payload;
    setSaveText(t("saved"));
  } catch (e) {
    setSaveText(t("saveFailed"));
  }
}
function buildTitleRow(d) {
  const row = el("div", "trow");
  const inp = fInput("text", d.title || "", t("analysisName"), (v) => { lastData.title = v; scheduleSave(); });
  saveBox = el("span", "savestate", lastSaved === savePayload(d) ? t("saved") : "");
  row.append(labeled(t("analysisName"), inp), saveBox);
  return row;
}
function fmtDate(s) {
  if (!s) return "";
  const raw = String(s).replace(" ", "T");
  const dt = new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(raw) ? raw : raw + "Z");
  return isNaN(dt) ? String(s) : dt.toLocaleString(lang === "ar" ? "ar-IQ" : "en-US", { dateStyle: "medium", timeStyle: "short" });
}

async function openAnalysis(id) {
  show("loading");
  try {
    const data = await api("/analysis/" + id, undefined, "GET");
    const common = { filter_meta: data.filter_meta, upload_id: id, title: data.title, saved: true };
    lastData = { ...data.state, ...common };
    baseData = JSON.parse(JSON.stringify({ ...data.base, ...common }));
    resetFilter();
    const ui = data.state.ui;
    if (ui) fState = { rows: ui.rows || [], hidden: ui.hidden || [], gran: ui.gran || "", dateCol: ui.dateCol || "", open: false };
    lastSaved = savePayload(lastData);
    setHash(id);
    renderResults(lastData);
    show("results");
  } catch (err) {
    setHash(null);
    show("upload");
    showError(err instanceof TypeError ? t("errNet") : t("errOpen"));
  }
}

    const s = mkSec("audience", "secAudience");
    const g = el("div", "mgrid");
    p.audiences.forEach((a) => g.appendChild(mkCard(a.name, mkBadge(a.priority), mkP(a.description), mkLab("mktMessage", a.message), mkEv(a.evidence))));
    s.appendChild(g);
  }

  // 3) الفرص والمخاطر
  if ((p.opportunities || []).length || (p.risks || []).length) {
    const s = mkSec("opp", "secOpp");
    const cols = el("div", "mcols");
    const side = (key, items) => {
      const box = el("div");
      box.appendChild(el("h3", "", t(key)));
      items.forEach((x) => { box.appendChild(mkCard(x.title, mkP(x.detail), mkEv(x.evidence))); box.lastChild.style.marginBottom = "10px"; });
      return box;
    };
    if (p.opportunities.length) cols.appendChild(side("mktOpportunities", p.opportunities));
    if (p.risks.length) cols.appendChild(side("mktRisks", p.risks));
    s.appendChild(cols);
  }

  // 4) الرسالة والتموضع
  const pos = p.positioning || {};
  if (pos.value_proposition || (pos.slogans || []).length) {
    const s = mkSec("position", "secPosition");
    s.append(mkLab("mktValue", pos.value_proposition) || "", mkLab("mktTone", pos.tone) || "");
    if ((pos.slogans || []).length) {
      s.appendChild(el("h3", "", t("mktSlogans")));
      const w = el("div");
      pos.slogans.forEach((x) => w.appendChild(el("span", "slogan", x)));
      s.appendChild(w);
    }
  }

  // 5) القنوات والميزانية
  if ((p.channels || []).length) {
    const s = mkSec("channels", "secChannels");
    const bar = el("div", "mbar"), legend = el("div", "mlegend");
    p.channels.forEach((c, i) => {
      const color = MKT_COLORS[i % MKT_COLORS.length];
      const seg = el("i");
      seg.style.width = c.budget_share + "%";
      seg.style.background = color;
      seg.title = `${c.name} ${c.budget_share}%`;
      bar.appendChild(seg);
      const lg = el("span", "", `${c.name} ${c.budget_share}%`);
      lg.style.setProperty("--c", color);
      legend.appendChild(lg);
    });
    s.append(bar, legend);
    const g = el("div", "mgrid");
    p.channels.forEach((c) => {
      g.appendChild(mkCard(c.name, mkBadge(c.priority), mkP(c.why), mkLab("mktShare", c.budget_share + "%"),
        (c.actions || []).length ? el("div", "", "") : null));
      const card = g.lastChild;
      if ((c.actions || []).length) { card.appendChild(el("b", "", t("mktActions") + ":")); card.appendChild(mkList(c.actions)); }
    });
    s.appendChild(g);
  }

  // 6) المحتوى والعروض
  if ((p.content || []).length || (p.offers || []).length) {
    const s = mkSec("content", "secContent");
    if (p.content.length) {
      s.appendChild(el("h3", "", t("mktContentIdeas")));
      s.appendChild(mkTable([t("mktIdea"), t("mktFormat"), t("mktTiming"), t("mktAudience")], p.content.map((c) => [c.idea, c.format, c.timing, c.audience])));
    }
    if (p.offers.length) {
      s.appendChild(el("h3", "", t("mktOffers")));
      const g = el("div", "mgrid");
      p.offers.forEach((o) => g.appendChild(mkCard(o.title, mkP(o.detail), mkP(o.target))));
      s.appendChild(g);
    }
  }

  // 7) خطة 90 يوم
  if ((p.timeline || []).length) {
    const s = mkSec("timeline", "secTimeline");
    const g = el("div", "mtl");
    p.timeline.forEach((ph) => g.appendChild(mkCard(ph.phase, mkP(ph.focus), mkList(ph.tasks))));
    s.appendChild(g);
  }

  // 8) المؤشرات
  if ((p.kpis || []).length) {
    const s = mkSec("kpi", "secKpi");
    s.appendChild(mkTable([t("mktKpi"), t("mktTarget"), t("mktHow")], p.kpis.map((k) => [k.name, k.target, k.how_to_measure])));
  }

  // 9) فجوات البيانات
  if ((p.data_gaps || []).length) {
    const s = mkSec("gaps", "secGaps");
    s.appendChild(mkList(p.data_gaps));
  }

  const nav = el("nav", "glass mnav");
  secs.forEach(([id, key]) => {
    const b = el("button", "mpill", t(key));
    b.type = "button";
    b.addEventListener("click", () => document.getElementById("msec-" + id).scrollIntoView({ behavior: "smooth", block: "start" }));
    nav.appendChild(b);
  });
  root.appendChild(nav);
  secs.forEach(([, , s]) => root.appendChild(s));
  root.appendChild(el("p", "mnote", t("mktNote")));
}

/* بصمة التحليل الحالي (المخططات + الفلاتر): إذا تغيّرت، الخطة القديمة ما تناسب وتنعاد */
const marketSig = (d) => JSON.stringify([currentSpecs(d), filterPayload(d.filter_meta)]);

async function generateMarketing() {
  const d = lastData;
  if (!d || !d.upload_id || !d.filter_meta || mktBusy) return;
  const sig = marketSig(d);
  mktBusy = true;
  mktError = "";
  renderMarketing();
  try {
    const data = await api("/marketing-plan", {
      upload_id: d.upload_id, ...filterPayload(d.filter_meta), specs: currentSpecs(d),
      goal: mktOpts.goal.trim() || null, budget: mktOpts.budget || null, lang
    });
    lastData = { ...lastData, marketing: { plan: data.plan, meta: data.meta, lang, sig } };
    scheduleSave();                                        // التحليل المحفوظ يحتفظ بالخطة
  } catch (e) {
    mktError = e instanceof TypeError ? t("errNet") : (e.message || t("mktErr"));
  }
  mktBusy = false;
  if (curView === "market") renderMarketing();
}

async function openMarketing() {
  const d = lastData;
  if (!d || !d.upload_id) return;
  if (!mktOpts.goal && dState.goal) mktOpts.goal = dState.goal;
  show("market");
  if (d.marketing && d.marketing.lang === lang && d.marketing.sig === marketSig(d)) renderMarketing(); else await generateMarketing();
}

/* ---------- واجهة الترحيب ---------- */
function renderContinue() {
  const box = $("wContinue");
  const it = histItems && histItems[0];
  if (!it) { box.style.display = "none"; return; }
  box.innerHTML = "";
  const info = el("div", "w-cinfo");
  info.append(el("small", "", t("wContinue")), el("b", "", it.title));
  const b = el("button", "btn sm", t("openAnalysis"));
  b.type = "button";
  b.addEventListener("click", () => openAnalysis(it.id));
  box.append(info, b);
  box.style.display = "flex";
}
function loadContinue() {
  api("/my-analyses", undefined, "GET").then((r) => { histItems = r.items || []; renderContinue(); }).catch(() => {});
}
function goWelcome() { setHash(null); show("welcome"); loadContinue(); }
$("startBtn").addEventListener("click", () => show("upload"));
$("startBtn2").addEventListener("click", () => show("upload"));
$("wHistBtn").addEventListener("click", openHistory);
const brand = document.querySelector("header.top .wordmark");
brand.setAttribute("role", "link");
brand.setAttribute("tabindex", "0");
brand.addEventListener("click", goWelcome);
brand.addEventListener("keydown", (e) => { if (e.key === "Enter") goWelcome(); });
applyLang();
{
  const m = location.hash.match(/^#a=([0-9a-f]{32})$/);
  if (m) openAnalysis(m[1]); else { show("welcome"); loadContinue(); }
}
/* تغيير الرابط يدوياً أو زر الرجوع: نفتح التحليل المطلوب (setHash يستعمل replaceState فما يسبب تكرار) */
window.addEventListener("hashchange", () => {
  const m = location.hash.match(/^#a=([0-9a-f]{32})$/);
  if (m && !(lastData && lastData.upload_id === m[1] && curView === "results")) openAnalysis(m[1]);
});
</script>

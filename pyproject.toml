[project]
name = "analyze"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "arabic-reshaper>=3.0.1",
    "fastapi>=0.141.1",
    "matplotlib>=3.11.2",
    "openai>=3.20.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "python-bidi>=0.6.11",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.1",
    "uvicorn>=0.53.0",
]

[project.scripts]
analyze = "analyze:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
